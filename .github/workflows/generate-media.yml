# ═══════════════════════════════════════════════════════════════
#  EOTC Media Studio — Automated Content & Video Pipeline
#  Generates spiritual content, renders images + cinematic
#  TikTok videos, and broadcasts to Telegram automatically.
# ═══════════════════════════════════════════════════════════════

name: "✝️ EOTC Media Studio — Generate Content"

on:
  # ────────────────────────────────────────────────
  # MANUAL TRIGGER: Click "Run workflow" on GitHub
  # ────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      content_type:
        description: "📋 Content Type to Generate"
        type: choice
        options:
          - quote
          - verse
          - carousel
          - reflection
        default: quote
      use_liturgical:
        description: "📅 Apply Liturgical Calendar (feast/fast/saint of the day)"
        type: boolean
        default: true

  # ────────────────────────────────────────────────
  # AUTOMATED SCHEDULE (East Africa Time / UTC+3)
  # ────────────────────────────────────────────────
  # Uncomment below to enable fully autonomous daily posting:
  # schedule:
  #   - cron: '0 2 * * *'   # 5:00 AM EAT → Daily Verse
  #   - cron: '0 9 * * *'   # 12:00 PM EAT → Power Quote
  #   - cron: '0 15 * * *'  # 6:00 PM EAT → Deep Dive Carousel
  #   - cron: '0 5 * * 0'   # Sun 8:00 AM EAT → Weekly Reflection

concurrency:
  group: content-generation
  cancel-in-progress: false

jobs:
  generate:
    name: "🎬 Generate Content + Cinematic Video"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. CHECKOUT CODE ──
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      # ── 2. SETUP NODE.JS ──
      - name: "⚙️ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      # ── 3. INSTALL SYSTEM DEPS (Puppeteer + Fonts) ──
      - name: "🔧 Install System Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgbm1 libasound2t64 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libpango-1.0-0 libcairo2 libatspi2.0-0 \
            libxshmfence1 fonts-noto-color-emoji fonts-noto-core

      # ── 4. INSTALL NPM PACKAGES ──
      - name: "📦 Install Project Dependencies"
        run: npm ci --prefer-offline

      # ── 5. CREATE .ENV SECRETS ──
      - name: "🔐 Create Environment File"
        shell: bash
        run: |
          cat > .env << EOF
          GOOGLE_AI_STUDIO_API=${{ secrets.GOOGLE_AI_STUDIO_API }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE=${{ vars.SUPABASE_TABLE || 'quotes' }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          AI_MODEL=google/gemini-2.5-flash
          PUPPETEER_EXEC_PATH=/usr/bin/google-chrome
          LOG_LEVEL=INFO
          EOF

      # ── 6. DETERMINE CONTENT TYPE ──
      - name: "🧠 Determine Content Type"
        id: compute-type
        run: |
          TYPE="${{ github.event.inputs.content_type }}"
          LITURGICAL="${{ github.event.inputs.use_liturgical }}"

          # Smart defaults for scheduled runs
          if [ -z "$TYPE" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 6 ]; then TYPE="verse"
            elif [ "$HOUR" -lt 12 ]; then TYPE="quote"
            elif [ "$HOUR" -lt 18 ]; then TYPE="carousel"
            else TYPE="reflection"; fi
          fi

          if [ -z "$LITURGICAL" ]; then
            LITURGICAL="true"
          fi

          echo "🎯 Content: $TYPE | Liturgical: $LITURGICAL"
          echo "target_type=$TYPE" >> $GITHUB_OUTPUT
          echo "use_liturgical=$LITURGICAL" >> $GITHUB_OUTPUT

      # ── 7. RUN THE FULL PIPELINE ──
      - name: "🚀 Run Media Pipeline (Image + Video + Telegram)"
        id: pipeline
        run: |
          LITURGICAL_FLAG=""
          if [ "${{ steps.compute-type.outputs.use_liturgical }}" == "true" ]; then
            LITURGICAL_FLAG="--liturgical"
          fi
          node src/index.js ${{ steps.compute-type.outputs.target_type }} $LITURGICAL_FLAG

      # ── 8. SAVE IMAGE ARTIFACT ──
      - name: "🖼️ Upload Image Artifact"
        if: always() && steps.compute-type.outputs.target_type != 'carousel'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ steps.compute-type.outputs.target_type }}-${{ github.run_id }}
          path: ./src/output.png
          retention-days: 7

      # ── 9. SAVE TIKTOK VIDEO ARTIFACT ──
      - name: "🎬 Upload TikTok Video Artifact"
        if: always() && steps.compute-type.outputs.target_type != 'carousel'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-${{ github.run_id }}
          path: ./src/tiktok_latest.mp4
          retention-days: 7
          if-no-files-found: ignore

      # ── 10. SAVE CAROUSEL ARTIFACT ──
      - name: "🎠 Upload Carousel Artifacts"
        if: always() && steps.compute-type.outputs.target_type == 'carousel'
        uses: actions/upload-artifact@v4
        with:
          name: carousel-${{ github.run_id }}
          path: ./temp/carousel/run_*/*.png
          retention-days: 7

      # ── 11. PIPELINE SUMMARY ──
      - name: "📊 Pipeline Summary"
        if: always()
        run: |
          echo "## ✝️ EOTC Media Studio Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ steps.pipeline.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Content Type** | ${{ steps.compute-type.outputs.target_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Liturgical** | ${{ steps.compute-type.outputs.use_liturgical }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Video Engine** | FFmpeg Ken Burns + Google Amharic TTS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Downloads" >> $GITHUB_STEP_SUMMARY
          echo "Scroll down to **Artifacts** to download the generated image and TikTok-ready MP4 video." >> $GITHUB_STEP_SUMMARY
