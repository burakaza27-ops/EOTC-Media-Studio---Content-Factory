name: "✝️ EOTC Media Studio — Generate Content"

on:
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content type to generate'
        required: true
        type: choice
        options:
          - quote
          - verse
          - carousel
          - reflection
          - saint
          - fasting
          - holyweek
          - history
          - calendar
        default: 'quote'
      use_liturgical:
        description: 'Use liturgical calendar context'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  generate:
    name: "✝️ Generate ${{ github.event.inputs.content_type }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎨 Generate Content
        env:
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
          USE_LITURGICAL: ${{ github.event.inputs.use_liturgical }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          PUPPETEER_EXEC_PATH: /usr/bin/google-chrome-stable
        run: node src/index.js

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eotc-media-${{ github.event.inputs.content_type }}-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
