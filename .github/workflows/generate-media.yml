name: "✝️ EOTC Media Studio — Generate Content"

on:
  workflow_dispatch:
    inputs:
      content_type:
        description: '📋 What content to generate'
        required: true
        type: choice
        options:
          - quote
          - verse
          - carousel
          - reflection
          - saint
          - fasting
          - holyweek
          - history
          - calendar
          - all
        default: 'quote'

      output_format:
        description: '📐 Output format — image only, or image + video reel'
        required: true
        type: choice
        options:
          - 'Image — Square 1:1 (1080×1080)'
          - 'Image — Vertical 9:16 (1080×1920)'
          - 'Image — Portrait 4:5 (1080×1350)'
          - 'Image + Video Reel — Square 1:1'
          - 'Image + Video Reel — Vertical 9:16'
          - 'Image + Video Reel — Square AND Vertical (both)'
        default: 'Image — Square 1:1 (1080×1080)'

      custom_theme:
        description: '✏️  Custom topic / scripture (leave empty for daily liturgical theme)'
        required: false
        type: string
        default: ''

      use_liturgical:
        description: '📅 Apply liturgical calendar context'
        required: false
        type: boolean
        default: true

  schedule:
    # Daily 06:00 AM EAT (03:00 UTC) — auto-generates daily quote
    - cron: '0 3 * * *'

permissions:
  contents: read
  actions: read

jobs:
  generate:
    name: "✝️ Generate ${{ github.event.inputs.content_type || 'quote' }} › ${{ github.event.inputs.output_format || 'Image — Square 1:1 (1080×1080)' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔤 Install Ethiopian Fonts & System Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-sil-abyssinica \
            xvfb \
            ffmpeg \
            libnss3 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libxshmfence1
          # Ubuntu 24.04 renamed libasound2 → libasound2t64
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          fc-cache -f -v || true

      - name: 🌐 Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb || \
            (sudo dpkg -i google-chrome-stable_current_amd64.deb && sudo apt-get install -f -y)
          rm -f google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: 🔧 Resolve output format settings
        id: fmt
        run: |
          FORMAT="${{ github.event.inputs.output_format || 'Image — Square 1:1 (1080×1080)' }}"
          echo "Selected format: $FORMAT"

          # Determine aspect ratio for images / carousel
          case "$FORMAT" in
            *"9:16"*)  ASPECT="9:16" ;;
            *"4:5"*)   ASPECT="4:5"  ;;
            *)         ASPECT="1:1"  ;;
          esac

          # Determine video profiles
          case "$FORMAT" in
            *"Image + Video Reel — Square"*)       VIDEO=true  ; PROFILES="1:1"      ;;
            *"Image + Video Reel — Vertical"*)     VIDEO=true  ; PROFILES="9:16"     ;;
            *"Image + Video Reel — Square AND"*)   VIDEO=true  ; PROFILES="1:1,9:16" ;;
            *)                                      VIDEO=false ; PROFILES=""         ;;
          esac

          echo "ASPECT_RATIO=$ASPECT"        >> "$GITHUB_OUTPUT"
          echo "GENERATE_VIDEO=$VIDEO"       >> "$GITHUB_OUTPUT"
          echo "VIDEO_PROFILES=$PROFILES"    >> "$GITHUB_OUTPUT"

          echo "→ Image aspect: $ASPECT | Video: $VIDEO | Profiles: $PROFILES"

      - name: 🎨 Generate Content
        env:
          CONTENT_TYPE:          ${{ github.event.inputs.content_type || 'quote' }}
          CUSTOM_THEME:          ${{ github.event.inputs.custom_theme || '' }}
          USE_LITURGICAL:        ${{ github.event.inputs.use_liturgical || 'true' }}
          GENERATE_VIDEO:        ${{ steps.fmt.outputs.GENERATE_VIDEO }}
          VIDEO_PROFILES:        ${{ steps.fmt.outputs.VIDEO_PROFILES }}
          ASPECT_RATIO:          ${{ steps.fmt.outputs.ASPECT_RATIO }}
          CAROUSEL_ASPECT_RATIO: ${{ steps.fmt.outputs.ASPECT_RATIO }}
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_STUDIO_API:  ${{ secrets.GOOGLE_AI_STUDIO_API }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_IDS:    ${{ secrets.TELEGRAM_ADMIN_IDS }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:          ${{ secrets.SUPABASE_KEY }}
          AI_MODEL:              google/gemini-2.5-flash
          GITHUB_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          PUPPETEER_EXEC_PATH:   /usr/bin/google-chrome-stable
          DISPLAY:               :99
        run: |
          Xvfb :99 -screen 0 2560x1920x24 &
          sleep 1
          node src/index.js

      - name: 📤 Upload Generated Media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eotc-media-${{ github.event.inputs.content_type || 'quote' }}-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
