<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Fasting Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #030208;
      --bg-deep: #0a0715;
      --mood-primary: #9b72cf;
      --mood-primary-light: #c4a8e0;
      --mood-primary-dim: #6b4d8a;
      --mood-glow: rgba(155, 114, 207, 0.22);
      --mood-bg-accent: rgba(100, 60, 150, 0.10);
      --white: #ffffff;
      --white-90: rgba(255, 255, 255, 0.90);
      --white-60: rgba(255, 255, 255, 0.60);
      --white-30: rgba(255, 255, 255, 0.30);
      --white-08: rgba(255, 255, 255, 0.08);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1, "liga" 1; }

    body {
      width: 1080px; height: 1350px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden; position: relative;
      background: var(--bg-void);
    }

    /* Background */
    .bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 50% 0%, var(--mood-bg-accent) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 100%, rgba(155, 114, 207, 0.04) 0%, transparent 40%),
        linear-gradient(170deg, var(--bg-void) 0%, var(--bg-deep) 50%, #0f0c1a 100%);
      z-index: 0;
    }

    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }

    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
      z-index: 1; pointer-events: none;
    }

    .frame {
      position: absolute; top: 48px; left: 48px; right: 48px; bottom: 48px;
      border: 1px solid rgba(255,255,255,0.04); z-index: 2;
    }

    /* Ethiopian date badge */
    .eth-date {
      position: absolute; top: 72px; right: 76px; z-index: 10;
      font-size: 13px; letter-spacing: 0.15em;
      color: var(--mood-primary-light); font-weight: 700;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 6px 18px; border-radius: 16px;
    }

    /* Content */
    .content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 100px 90px;
    }

    /* Header */
    .header { text-align: center; margin-bottom: 50px; }

    .fast-badge {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.35em;
      color: var(--mood-primary-light); text-transform: uppercase; font-weight: 700;
      border-bottom: 1.5px solid var(--mood-primary-dim);
      padding-bottom: 8px; margin-bottom: 24px;
    }

    .fast-name {
      font-size: 52px; font-weight: 900; line-height: 1.25;
      background: linear-gradient(140deg, var(--white) 25%, var(--mood-primary-light) 55%, var(--white) 80%);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,0.4));
      margin-bottom: 12px;
    }

    .day-count {
      font-size: 22px; font-weight: 600; color: var(--mood-primary-light);
      letter-spacing: 0.08em;
    }

    /* Progress bar */
    .progress-container {
      width: 100%; height: 8px;
      background: var(--white-08); border-radius: 4px;
      margin: 35px 0 45px; overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--mood-primary-dim), var(--mood-primary), var(--mood-primary-light));
      border-radius: 4px;
      box-shadow: 0 0 14px var(--mood-glow);
      transition: width 0.3s ease;
    }

    /* Rules section */
    .rules-header {
      font-size: 16px; font-weight: 800; letter-spacing: 0.25em;
      color: var(--mood-primary); text-transform: uppercase;
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 10px;
    }
    .rules-header::before { content: '🍽️'; font-size: 16px; }

    .rules-list {
      list-style: none; margin-bottom: 40px;
    }

    .rules-list li {
      font-size: 22px; font-weight: 500; color: var(--white-90);
      line-height: 1.6; padding: 10px 0 10px 30px;
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .rules-list li::before {
      content: '•'; position: absolute; left: 8px;
      color: var(--mood-primary); font-size: 18px;
    }

    /* Encouragement */
    .encouragement {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
    }

    .encouragement-text {
      font-size: 30px; font-weight: 600; line-height: 1.55;
      color: var(--white-90);
      border-left: 3px solid var(--mood-primary);
      padding-left: 40px;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }

    .ref {
      margin-top: 30px;
      font-size: 18px; font-weight: 700;
      color: var(--mood-primary-light);
      letter-spacing: 0.1em;
      padding-left: 40px;
    }

    /* Footer */
    .footer {
      display: flex; justify-content: center; align-items: center;
      gap: 14px; margin-top: auto;
    }
    .footer-line { width: 45px; height: 1px; background: linear-gradient(90deg, transparent, var(--mood-primary-dim), transparent); }
    .footer-text { font-size: 13px; letter-spacing: 0.4em; color: var(--white-30); text-transform: uppercase; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="frame"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="header">
      <div class="fast-badge">ጾም Guide</div>
      <h1 class="fast-name" id="fast-name">ዐቢይ ጾም</h1>
      <div class="day-count" id="fast-day-count">Day 23 of 55</div>
    </div>

    <div class="progress-container">
      <div class="progress-fill" id="progress-bar" style="width: 42%"></div>
    </div>

    <div class="rules-header">Fasting Rules</div>
    <ul class="rules-list" id="fasting-rules-list">
      <li>No food or drink until 3 PM</li>
      <li>No meat, dairy, or eggs</li>
      <li>Plant-based meals only</li>
    </ul>

    <div class="encouragement">
      <p class="encouragement-text" id="encouragement-text">።።።</p>
      <div class="ref" id="scripture-ref"></div>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">Fasting Guide • EOTC Youth</div>
      <div class="footer-line"></div>
    </div>
  </div>
</body>
</html>
