<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Saint of the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void:    #010206;
      --bg-deep:    #060910;
      --crimson:    #8b1a1a;
      --crimson-lt: #c0392b;
      --gold-400:   #d4af37;
      --gold-200:   #f0d890;
      --gold-50:    #fdf8e8;
      --gold-glow:  rgba(212,175,55,0.28);
      --mood-primary:       #d4af37;
      --mood-primary-light: #f0d890;
      --mood-glow:          rgba(212,175,55,0.25);
      --mood-bg-accent:     rgba(212,175,55,0.07);
      --white:    #ffffff;
      --white-90: rgba(255,255,255,0.90);
      --white-70: rgba(255,255,255,0.70);
      --white-60: rgba(255,255,255,0.60);
      --white-50: rgba(255,255,255,0.50);
      --white-30: rgba(255,255,255,0.30);
      --white-06: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    @keyframes haloGlow {
      0%,100% { opacity: 0.45; transform: translate(-50%,-50%) scale(1);    }
      50%      { opacity: 0.80; transform: translate(-50%,-50%) scale(1.07); }
    }
    @keyframes shimmer {
      0%,100% { opacity: 0.5; } 50% { opacity: 1; }
    }
    @keyframes cornerPulse {
      0%,100% { border-color: rgba(212,175,55,0.35); }
      50%      { border-color: rgba(212,175,55,0.60); }
    }

    body {
      width: 1080px; height: 1080px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden; position: relative;
      background: var(--bg-void);
      display: flex; align-items: center; justify-content: center;
    }

    /* ══ BACKGROUNDS ══ */
    .bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(139,26,26,0.18) 0%, transparent 55%),
        linear-gradient(165deg, var(--bg-void) 0%, #080c14 45%, var(--bg-deep) 100%);
      z-index: 0;
    }
    .saint-halo {
      position: absolute; width: 820px; height: 820px;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(212,175,55,0.16) 0%, rgba(212,175,55,0.05) 38%, transparent 65%);
      border-radius: 50%; z-index: 0;
      animation: haloGlow 10s ease-in-out infinite;
      filter: blur(8px);
    }
    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.028'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }
    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 36%, rgba(0,0,0,0.65) 100%);
      z-index: 1; pointer-events: none;
    }

    /* ══ ETHIOPIAN DATE BADGE ══ */
    .eth-date {
      position: absolute; top: 62px; right: 68px; z-index: 10;
      font-size: 13px; letter-spacing: 0.16em;
      color: var(--gold-200); font-weight: 700;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--white-06);
      padding: 6px 18px; border-radius: 16px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
    }

    /* ══ MAIN CONTENT ══ */
    .content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 90px 88px;
      text-align: center;
    }

    /* Feast type badge */
    .feast-badge {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.38em;
      color: var(--gold-200); text-transform: uppercase; font-weight: 700;
      border: 1px solid rgba(212,175,55,0.30);
      padding: 8px 30px; border-radius: 26px;
      background: rgba(212,175,55,0.06);
      margin-bottom: 32px;
      font-family: 'Cinzel', serif;
      box-shadow: 0 0 20px rgba(212,175,55,0.08);
    }

    /* Cross icon */
    .saint-icon {
      width: 72px; height: 72px; margin: 0 auto 28px;
    }
    .saint-icon svg { width: 72px; height: 72px; }

    /* Saint name — the hero */
    .saint-name {
      font-size: clamp(48px, 7vw, 72px);
      font-weight: 900;
      line-height: 1.25;
      background: linear-gradient(145deg, #ffffff 15%, var(--gold-200) 50%, #ffffff 80%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
      margin-bottom: 32px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Separator */
    .sep {
      display: flex; align-items: center; gap: 16px;
      width: 320px; margin: 0 auto 36px;
    }
    .sep-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.65), transparent);
    }
    .sep-dot {
      color: var(--gold-400); font-size: 15px;
      filter: drop-shadow(0 0 8px var(--gold-glow));
      animation: shimmer 5s ease-in-out infinite;
    }

    /* Story text */
    .saint-story {
      font-size: 27px;
      font-weight: 500;
      line-height: 1.70;
      color: var(--white-90);
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 22px;
      padding: 0 10px;
    }

    /* Lesson text */
    .saint-lesson {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.65;
      color: rgba(240, 216, 144, 0.88);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      padding: 16px 28px;
      font-style: italic;
      background: rgba(212,175,55,0.05);
      border-radius: 8px;
      border-left: 2px solid rgba(212,175,55,0.35);
    }

    /* Scripture reference */
    .ref {
      margin-top: 28px;
      font-size: 18px; font-weight: 700;
      color: var(--gold-200);
      letter-spacing: 0.10em;
      text-shadow: 0 0 18px rgba(212,175,55,0.50);
      font-family: 'Noto Sans Ethiopic', sans-serif;
    }

    /* ══ FOOTER ══ */
    .footer {
      position: absolute; bottom: 54px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 20px;
      z-index: 10;
    }
    .footer-line {
      flex: 1; max-width: 180px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.40), transparent);
    }
    .footer-text {
      font-size: 12px; letter-spacing: 0.42em;
      color: rgba(212,175,55,0.60); text-transform: uppercase;
      font-weight: 700; font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="saint-halo"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="feast-badge" id="feast-type-badge">SAINT</div>

    <div class="saint-icon">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"
           style="filter:drop-shadow(0 0 18px rgba(212,175,55,0.9))">
        <defs>
          <linearGradient id="scg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#fdf8e8"/>
            <stop offset="50%"  stop-color="#f0d890"/>
            <stop offset="100%" stop-color="#b8962e"/>
          </linearGradient>
        </defs>
        <rect x="48" y="5"  width="24" height="110" rx="2.5" fill="url(#scg)"/>
        <rect x="5"  y="48" width="110" height="24" rx="2.5" fill="url(#scg)"/>
        <rect x="35" y="19" width="50" height="13" rx="2" fill="url(#scg)"/>
        <rect x="35" y="88" width="50" height="13" rx="2" fill="url(#scg)"/>
        <rect x="19" y="35" width="13" height="50" rx="2" fill="url(#scg)"/>
        <rect x="88" y="35" width="13" height="50" rx="2" fill="url(#scg)"/>
        <circle cx="60" cy="60" r="19" fill="url(#scg)"/>
        <circle cx="60" cy="60" r="11" fill="#05090e"/>
        <circle cx="60" cy="60" r="5.5" fill="url(#scg)"/>
      </svg>
    </div>

    <h1 class="saint-name" id="saint-name">ቅዱስ ጊዮርጊስ</h1>

    <div class="sep">
      <div class="sep-line"></div>
      <div class="sep-dot">✦</div>
      <div class="sep-line"></div>
    </div>

    <p class="saint-story" id="saint-story">።።።</p>
    <p class="saint-lesson" id="saint-lesson">።።።</p>
    <div class="ref" id="scripture-ref"></div>
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-text" id="footer-text">Saint of the Day • EOTC Youth</div>
    <div class="footer-line"></div>
  </div>
</body>
</html>
