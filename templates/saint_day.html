<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Saint of the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #020308;
      --bg-deep: #060910;
      --mood-primary: #d4af37;
      --mood-primary-light: #f0d890;
      --mood-primary-dim: #8a7122;
      --mood-glow: rgba(212, 175, 55, 0.25);
      --mood-bg-accent: rgba(212, 175, 55, 0.08);
      --white: #ffffff;
      --white-90: rgba(255, 255, 255, 0.90);
      --white-60: rgba(255, 255, 255, 0.60);
      --white-30: rgba(255, 255, 255, 0.30);
      --white-06: rgba(255, 255, 255, 0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1, "liga" 1; }

    @keyframes haloGlow {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.05); }
    }

    body {
      width: 1080px; height: 1080px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden; position: relative;
      background: var(--bg-void);
      display: flex; align-items: center; justify-content: center;
    }

    
    /* === LALIBELA CROSS BRAND === */
    .brand-lalibela { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .brand-lalibela img { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="saint-halo"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="feast-badge" id="feast-type-badge">SAINT</div>
    <div class="saint-icon">✝</div>
    <h1 class="saint-name" id="saint-name">ቅዱስ ጊዮርጊስ</h1>
    <div class="sep">
      <div class="sep-line"></div>
      <div class="sep-dot">✦</div>
      <div class="sep-line"></div>
    </div>
    <p class="saint-story" id="saint-story">።።።</p>
    <p class="saint-lesson" id="saint-lesson">።።።</p>
    <div class="ref" id="scripture-ref"></div>
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-text" id="footer-text">Saint of the Day • EOTC Youth</div>
    <div class="footer-line"></div>
  </div>
</body>
</html>
