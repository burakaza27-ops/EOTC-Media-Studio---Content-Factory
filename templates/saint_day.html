<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Saint of the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #020308;
      --bg-deep: #060910;
      --mood-primary: #d4af37;
      --mood-primary-light: #f0d890;
      --mood-primary-dim: #8a7122;
      --mood-glow: rgba(212, 175, 55, 0.25);
      --mood-bg-accent: rgba(212, 175, 55, 0.08);
      --white: #ffffff;
      --white-90: rgba(255, 255, 255, 0.90);
      --white-60: rgba(255, 255, 255, 0.60);
      --white-30: rgba(255, 255, 255, 0.30);
      --white-06: rgba(255, 255, 255, 0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1, "liga" 1; }

    @keyframes haloGlow {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.05); }
    }

    body {
      width: 1080px; height: 1080px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden; position: relative;
      background: var(--bg-void);
      display: flex; align-items: center; justify-content: center;
    }

    /* Background */
    .bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(160deg, var(--bg-void) 0%, var(--bg-deep) 50%, #0c1018 100%); z-index: 0; }
    
    /* Sacred halo behind the saint */
    .saint-halo {
      position: absolute; top: 42%; left: 50%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--mood-glow) 0%, transparent 60%);
      border-radius: 50%; z-index: 1;
      animation: haloGlow 10s ease-in-out infinite;
    }

    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      z-index: 2; pointer-events: none;
    }

    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.55) 100%);
      z-index: 2; pointer-events: none;
    }

    /* Frame */
    .frame {
      position: absolute; top: 42px; left: 42px; right: 42px; bottom: 42px;
      border: 1px solid rgba(255,255,255,0.04); z-index: 3;
    }
    .frame::before { content: ''; position: absolute; top: -1px; left: -1px; width: 34px; height: 34px; border-top: 2.5px solid var(--mood-primary); border-left: 2.5px solid var(--mood-primary); }
    .frame::after { content: ''; position: absolute; bottom: -1px; right: -1px; width: 34px; height: 34px; border-bottom: 2.5px solid var(--mood-primary); border-right: 2.5px solid var(--mood-primary); }

    /* Content */
    .content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 100px 90px;
      text-align: center;
    }

    /* Feast type badge */
    .feast-badge {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      padding: 8px 28px; border-radius: 24px;
      font-size: 12px; letter-spacing: 0.35em;
      color: var(--mood-primary-light);
      text-transform: uppercase; font-weight: 700;
      margin-bottom: 30px;
    }

    /* Large cross icon */
    .saint-icon {
      font-size: 52px;
      color: var(--mood-primary);
      margin-bottom: 28px;
      filter: drop-shadow(0 0 18px var(--mood-glow));
    }

    /* Saint name */
    .saint-name {
      font-size: 50px; font-weight: 900;
      line-height: 1.3;
      background: linear-gradient(140deg, var(--white) 20%, var(--mood-primary-light) 50%, var(--white) 80%);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.35));
      margin-bottom: 30px;
      max-width: 800px;
    }

    /* Separator */
    .sep { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
    .sep-line { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--mood-primary-dim), transparent); }
    .sep-dot { font-size: 8px; color: var(--mood-primary); }

    /* Story text */
    .saint-story {
      font-size: 26px; font-weight: 500; line-height: 1.60;
      color: var(--white-90); max-width: 780px;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 24px;
    }

    /* Lesson text */
    .saint-lesson {
      font-size: 22px; font-weight: 600; line-height: 1.55;
      color: var(--mood-primary-light);
      font-style: italic; max-width: 720px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Scripture reference */
    .ref {
      margin-top: 28px;
      font-size: 17px; font-weight: 700;
      color: var(--white-60); letter-spacing: 0.12em;
      padding: 10px 30px;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    /* Footer */
    .footer {
      position: absolute; bottom: 68px;
      display: flex; align-items: center; gap: 14px; z-index: 10;
    }
    .footer-line { width: 45px; height: 1px; background: linear-gradient(90deg, transparent, var(--mood-primary-dim), transparent); }
    .footer-text { font-size: 13px; letter-spacing: 0.4em; color: var(--white-30); text-transform: uppercase; font-weight: 600; }

    /* Ethiopian date badge */
    .eth-date {
      position: absolute; top: 68px; right: 72px; z-index: 10;
      font-size: 13px; letter-spacing: 0.15em;
      color: var(--mood-primary-light); font-weight: 700;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 6px 18px; border-radius: 16px;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="saint-halo"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="frame"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="feast-badge" id="feast-type-badge">SAINT</div>
    <div class="saint-icon">✝</div>
    <h1 class="saint-name" id="saint-name">ቅዱስ ጊዮርጊስ</h1>
    <div class="sep">
      <div class="sep-line"></div>
      <div class="sep-dot">✦</div>
      <div class="sep-line"></div>
    </div>
    <p class="saint-story" id="saint-story">።።።</p>
    <p class="saint-lesson" id="saint-lesson">።።።</p>
    <div class="ref" id="scripture-ref"></div>
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-text">Saint of the Day • EOTC Youth</div>
    <div class="footer-line"></div>
  </div>
</body>
</html>
