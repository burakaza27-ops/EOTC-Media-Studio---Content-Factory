<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Church History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void:  #020205;
      --bg-deep:  #060810;
      --sepia:    #c4a06a;
      --sepia-dim: rgba(196,160,106,0.18);
      --gold:     #d4af37;
      --gold-lt:  #f0d890;
      --gold-pale:#fdf8e8;
      --gold-glow:rgba(212,175,55,0.22);
      --mood-primary:       #d4af37;
      --mood-primary-light: #f0d890;
      --mood-primary-dim:   #8a7122;
      --mood-glow:          rgba(212,175,55,0.22);
      --mood-bg-accent:     rgba(212,175,55,0.06);
      --white:    #ffffff;
      --white-90: rgba(255,255,255,0.90);
      --white-70: rgba(255,255,255,0.70);
      --white-60: rgba(255,255,255,0.60);
      --white-30: rgba(255,255,255,0.30);
      --white-06: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    @keyframes shimmer { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

    body {
      width: 1080px; height: 1350px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden; position: relative;
      background: var(--bg-void);
    }

    /* ══ BACKGROUNDS ══ */
    .bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(196,160,106,0.16) 0%, transparent 45%),
        radial-gradient(ellipse at 70% 85%, rgba(212,175,55,0.10) 0%, transparent 45%),
        linear-gradient(170deg, var(--bg-void) 0%, var(--bg-deep) 50%, #0d1018 100%);
      z-index: 0;
    }
    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.030'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }
    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.58) 100%);
      z-index: 1; pointer-events: none;
    }

    /* ══ DATE BADGE ══ */
    .eth-date {
      position: absolute; top: 62px; right: 68px; z-index: 10;
      font-size: 13px; letter-spacing: 0.16em; color: var(--gold-lt); font-weight: 700;
      background: rgba(255,255,255,0.03); border: 1px solid var(--white-06);
      padding: 6px 18px; border-radius: 16px;
    }

    /* ══ CONTENT ══ */
    .content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 100px 90px;
    }
    .header { margin-bottom: 50px; }

    /* Era + year row */
    .era-row { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
    .era-badge {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.35em; color: var(--sepia);
      text-transform: uppercase; font-weight: 700;
      border: 1px solid rgba(196,160,106,0.25); padding: 8px 24px; border-radius: 22px;
      background: rgba(196,160,106,0.04); font-family: 'Cinzel', serif;
    }
    .year-badge {
      font-size: 16px; font-weight: 900; color: var(--gold-lt);
      letter-spacing: 0.08em; font-family: 'Cinzel', serif;
    }

    /* Title */
    .title {
      font-size: 56px; font-weight: 900; line-height: 1.22;
      background: linear-gradient(to right, var(--white) 15%, var(--gold-lt) 50%, var(--white) 85%);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .title-line {
      width: 120px; height: 3px;
      background: linear-gradient(90deg, var(--sepia), var(--gold-lt), transparent);
      margin-top: 26px; border-radius: 2px;
      box-shadow: 0 0 16px rgba(196,160,106,0.30);
    }

    /* Narrative */
    .narrative { margin-bottom: 36px; }
    .narrative-text {
      font-size: 26px; font-weight: 500; line-height: 1.78;
      color: var(--white-90);
      display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Significance */
    .significance {
      background: rgba(196,160,106,0.06);
      border-left: 3px solid var(--sepia);
      border-radius: 0 8px 8px 0;
      padding: 24px 32px; flex: 1;
    }
    .sig-label {
      font-size: 11px; letter-spacing: 0.40em; font-weight: 700;
      color: var(--sepia); text-transform: uppercase;
      font-family: 'Cinzel', serif; margin-bottom: 16px;
    }
    .sig-text {
      font-size: 24px; font-weight: 500; line-height: 1.70;
      color: var(--white-70);
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Footer */
    .footer {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; margin-top: auto; padding-top: 36px;
    }
    .footer-line {
      flex: 1; max-width: 180px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.38), transparent);
    }
    .footer-text {
      font-size: 12px; letter-spacing: 0.44em; font-weight: 700;
      color: rgba(212,175,55,0.55); text-transform: uppercase;
      font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="header">
      <div class="era-row">
        <span class="era-badge" id="era-badge">Era</span>
        <span class="year-badge" id="year-badge"></span>
      </div>
      <h1 class="title" id="title">ርዕስ</h1>
      <div class="title-line"></div>
    </div>

    <div class="narrative">
      <p class="narrative-text" id="history-text">።።።</p>
    </div>

    <div class="significance">
      <div class="sig-label">Why It Matters Today</div>
      <p class="sig-text" id="significance-text">።።།</p>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">Church History • EOTC Youth</div>
      <div class="footer-line"></div>
    </div>
  </div>
</body>
</html>
