<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Church History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #020308;
      --bg-deep: #060910;
      --mood-primary: #d4af37;
      --mood-primary-light: #f0d890;
      --mood-primary-dim: #8a7122;
      --mood-glow: rgba(212, 175, 55, 0.25);
      --sepia: #c4a06a;
      --sepia-dim: rgba(196, 160, 106, 0.15);
      --white: #ffffff;
      --white-90: rgba(255, 255, 255, 0.90);
      --white-60: rgba(255, 255, 255, 0.60);
      --white-30: rgba(255, 255, 255, 0.30);
      --white-06: rgba(255, 255, 255, 0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1, "liga" 1; }

    body {
      width: 1080px; height: 1350px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden; position: relative;
      background: var(--bg-void);
    }

    .bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 30% 20%, var(--sepia-dim) 0%, transparent 45%),
        radial-gradient(ellipse at 70% 80%, var(--mood-glow) 0%, transparent 45%),
        linear-gradient(170deg, var(--bg-void) 0%, var(--bg-deep) 50%, #0d1018 100%);
      z-index: 0;
    }

    .grain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); z-index: 1; pointer-events: none; }
    .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.48) 100%); z-index: 1; pointer-events: none; }

    .frame { position: absolute; top: 48px; left: 48px; right: 48px; bottom: 48px; border: 1px solid var(--white-06); z-index: 2; }

    .eth-date { position: absolute; top: 72px; right: 76px; z-index: 10; font-size: 13px; letter-spacing: 0.15em; color: var(--mood-primary-light); font-weight: 700; background: rgba(255,255,255,0.03); border: 1px solid var(--white-06); padding: 6px 18px; border-radius: 16px; }

    .content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 100px 90px;
    }

    .header { margin-bottom: 50px; }

    .era-badge {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.35em;
      color: var(--sepia); text-transform: uppercase; font-weight: 700;
      border: 1px solid rgba(196, 160, 106, 0.2);
      padding: 8px 24px; border-radius: 22px;
      background: rgba(196, 160, 106, 0.04);
      margin-bottom: 24px;
    }

    .year-badge {
      display: inline-block; margin-left: 14px;
      font-size: 16px; font-weight: 900;
      color: var(--mood-primary-light);
      letter-spacing: 0.08em;
    }

    .title {
      font-size: 56px; font-weight: 900; line-height: 1.22;
      background: linear-gradient(to right, var(--white) 15%, var(--mood-primary-light) 50%, var(--white) 85%);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .title-line {
      width: 100px; height: 3px;
      background: linear-gradient(90deg, var(--sepia), var(--mood-primary-dim), transparent);
      margin-top: 28px; border-radius: 2px;
      box-shadow: 0 0 16px rgba(196, 160, 106, 0.3);
    }

    /* Narrative */
    .narrative {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
    }

    .narrative-text {
      font-size: 30px; font-weight: 500; line-height: 1.60;
      color: var(--white-90);
      border-left: 3px solid var(--sepia);
      padding-left: 45px;
      display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Significance */
    .significance {
      margin-top: 45px;
      background: linear-gradient(90deg, rgba(196, 160, 106, 0.08), rgba(196, 160, 106, 0.02), transparent);
      border-left: 4px solid var(--mood-primary);
      padding: 22px 35px 22px 28px;
    }

    .sig-label {
      font-size: 13px; font-weight: 800; letter-spacing: 0.3em;
      color: var(--mood-primary); text-transform: uppercase;
      margin-bottom: 10px;
    }

    .sig-text {
      font-size: 22px; font-weight: 600; line-height: 1.55;
      color: var(--mood-primary-light); font-style: italic;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    .footer { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: auto; padding-top: 30px; }
    .footer-line { width: 45px; height: 1px; background: linear-gradient(90deg, transparent, var(--mood-primary-dim), transparent); }
    .footer-text { font-size: 13px; letter-spacing: 0.4em; color: var(--white-30); text-transform: uppercase; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="frame"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="header">
      <span class="era-badge" id="era-badge">Era</span>
      <span class="year-badge" id="year-badge"></span>
      <h1 class="title" id="title">ርዕስ</h1>
      <div class="title-line"></div>
    </div>

    <div class="narrative">
      <p class="narrative-text" id="history-text">።።።</p>
    </div>

    <div class="significance">
      <div class="sig-label">Why It Matters Today</div>
      <p class="sig-text" id="significance-text">።።።</p>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">Church History • EOTC Youth</div>
      <div class="footer-line"></div>
    </div>
  </div>
</body>
</html>
