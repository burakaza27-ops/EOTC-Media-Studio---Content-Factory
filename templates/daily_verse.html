<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Daily Verse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-abyss: #050710;
      --bg-deep: #080c16;
      --bg-mid: #0e1320;
      --gold: #e2c073;
      --gold-bright: #f0d590;
      --gold-pale: #f7ecbf;
      --gold-dim: #b89a4a;
      --gold-dark: #7a6530;
      --gold-glow: rgba(226, 192, 115, 0.22);
      --gold-glow-strong: rgba(226, 192, 115, 0.40);
      --blue-glow: rgba(30, 58, 138, 0.08);
      --white: #ffffff;
      --white-85: rgba(255, 255, 255, 0.85);
      --white-55: rgba(255, 255, 255, 0.55);
      --white-30: rgba(255, 255, 255, 0.30);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    }

    @keyframes rotateRing {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    body {
      width: 1080px; height: 1080px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      background: var(--bg-abyss);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    
    /* === LALIBELA CROSS BRAND === */
    .brand-lalibela { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .brand-lalibela img { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bloom-top"></div>
  <div class="halo"></div>
  <div class="halo-inner"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  
  
  
  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="icon">📖</div>
    <div class="verse-text" id="quote-text">የእግዚአብሔር ቃል ሕያው ነውና፥ የሚሠራም...</div>
    <div class="verse-ref" id="scripture-ref">ዕብራውያን ፬፥፲፪</div>
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-text">Daily Scripture • EOTC Youth</div>
    <div class="footer-line"></div>
  </div>
</body>
</html>
