<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Daily Verse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-abyss: #010308;
      --bg-deep:  #060c18;
      --bg-mid:   #0d1422;
      --navy:     rgba(20,52,120,0.30);
      --gold:      #d4af37;
      --gold-lt:   #f0d890;
      --gold-pale: #fdf8e8;
      --gold-glow: rgba(212,175,55,0.24);
      --mood-primary:       #d4af37;
      --mood-primary-light: #f0d890;
      --mood-glow:          rgba(212,175,55,0.24);
      --mood-bg-accent:     rgba(212,175,55,0.06);
      --white:    #ffffff;
      --white-90: rgba(255,255,255,0.90);
      --white-65: rgba(255,255,255,0.65);
      --white-40: rgba(255,255,255,0.40);
      --white-06: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    @keyframes pulseGlow {
      0%,100% { opacity: 0.50; transform: translate(-50%,-50%) scale(1);    }
      50%      { opacity: 0.90; transform: translate(-50%,-50%) scale(1.07); }
    }
    @keyframes rotateRing {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to   { transform: translate(-50%,-50%) rotate(360deg); }
    }
    @keyframes shimmer {
      0%,100% { opacity: 0.5; } 50% { opacity: 1; }
    }
    @keyframes floatCard {
      0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); }
    }

    body {
      width: 1080px; height: 1080px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      background: var(--bg-abyss);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    /* ══ BACKGROUNDS ══ */
    .bg-base {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(160deg, var(--bg-abyss) 0%, var(--bg-deep) 45%, var(--bg-mid) 100%);
      z-index: 0;
    }
    .bloom-top {
      position: absolute; top: -10%; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 550px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(20,52,120,0.22) 0%, transparent 65%);
      z-index: 0; filter: blur(40px);
    }
    .halo {
      position: absolute; width: 780px; height: 780px; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(212,175,55,0.16) 0%, rgba(212,175,55,0.04) 40%, transparent 68%);
      border-radius: 50%; z-index: 0;
      animation: pulseGlow 11s ease-in-out infinite;
      filter: blur(10px);
    }
    .halo-inner {
      position: absolute; width: 340px; height: 340px; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(212,175,55,0.10) 0%, transparent 65%);
      border-radius: 50%; z-index: 0;
    }
    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.026'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }
    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.68) 100%);
      z-index: 1; pointer-events: none;
    }

    /* ══ DATE BADGE ══ */
    .eth-date {
      position: absolute; top: 62px; right: 68px; z-index: 10;
      font-size: 13px; letter-spacing: 0.16em;
      color: var(--gold-lt); font-weight: 700;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--white-06);
      padding: 6px 18px; border-radius: 16px;
    }

    /* ══ CONTENT ══ */
    .content {
      position: relative; z-index: 10;
      width: 100%; padding: 0 96px;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      animation: floatCard 18s ease-in-out infinite;
    }

    /* Manuscript icon (SVG) — replaces the 📖 emoji */
    .icon {
      width: 78px; height: 78px;
      margin: 0 auto 38px;
      filter: drop-shadow(0 0 18px rgba(212,175,55,0.85));
    }
    .icon svg { width: 78px; height: 78px; }

    /* Verse text — large, cinematic, gradient */
    .verse-text {
      font-size: clamp(34px, 4.8vw, 52px);
      font-weight: 800;
      line-height: 1.58;
      background: linear-gradient(148deg, #ffffff 20%, var(--gold-lt) 50%, #ffffff 75%, var(--gold-pale) 95%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
      display: -webkit-box;
      -webkit-line-clamp: 7;
      -webkit-box-orient: vertical;
      overflow: hidden;
      letter-spacing: 0.005em;
      margin-bottom: 44px;
    }

    /* Scripture reference */
    .verse-ref {
      font-size: 28px;
      font-weight: 800;
      color: var(--gold-lt);
      letter-spacing: 0.12em;
      text-shadow: 0 3px 20px rgba(212,175,55,0.60);
    }

    /* ══ FOOTER ══ */
    .footer {
      position: absolute; bottom: 56px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 20px;
      z-index: 10;
    }
    .footer-line {
      flex: 1; max-width: 180px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.40), transparent);
    }
    .footer-text {
      font-size: 12px; letter-spacing: 0.44em;
      color: rgba(212,175,55,0.58); text-transform: uppercase;
      font-weight: 700; font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bloom-top"></div>
  <div class="halo"></div>
  <div class="halo-inner"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <!-- SVG Open Bible / Manuscript icon — replaces emoji -->
    <div class="icon">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="vbg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#fdf8e8"/>
            <stop offset="50%"  stop-color="#f0d890"/>
            <stop offset="100%" stop-color="#b8962e"/>
          </linearGradient>
        </defs>
        <!-- Open book shape -->
        <path d="M10,25 Q10,20 15,20 L55,22 Q60,24 60,30 L60,95 Q60,90 55,89 L15,87 Q10,87 10,82 Z"
              fill="url(#vbg)" opacity="0.95"/>
        <path d="M110,25 Q110,20 105,20 L65,22 Q60,24 60,30 L60,95 Q60,90 65,89 L105,87 Q110,87 110,82 Z"
              fill="url(#vbg)" opacity="0.85"/>
        <!-- Center spine -->
        <rect x="58" y="20" width="4" height="76" rx="2" fill="#b8962e"/>
        <!-- Lines on pages -->
        <line x1="20" y1="38" x2="52" y2="38" stroke="rgba(5,9,14,0.30)" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="48" x2="52" y2="48" stroke="rgba(5,9,14,0.30)" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="58" x2="52" y2="58" stroke="rgba(5,9,14,0.25)" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="68" x2="45" y2="68" stroke="rgba(5,9,14,0.20)" stroke-width="2" stroke-linecap="round"/>
        <line x1="68" y1="38" x2="100" y2="38" stroke="rgba(5,9,14,0.30)" stroke-width="2" stroke-linecap="round"/>
        <line x1="68" y1="48" x2="100" y2="48" stroke="rgba(5,9,14,0.30)" stroke-width="2" stroke-linecap="round"/>
        <line x1="68" y1="58" x2="100" y2="58" stroke="rgba(5,9,14,0.25)" stroke-width="2" stroke-linecap="round"/>
        <line x1="68" y1="68" x2="92" y2="68" stroke="rgba(5,9,14,0.20)" stroke-width="2" stroke-linecap="round"/>
        <!-- Small cross on right page -->
        <rect x="81" y="76" width="3" height="10" rx="1" fill="#b8962e" opacity="0.8"/>
        <rect x="77" y="79" width="11" height="3" rx="1" fill="#b8962e" opacity="0.8"/>
      </svg>
    </div>

    <div class="verse-text" id="quote-text">የእግዚአብሔር ቃል ሕያው ነውና፥ የሚሠራም...</div>
    <div class="verse-ref" id="scripture-ref">ዕብራውያን ፬፥፲፪</div>
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-text">የዕለቱ ጥቅስ • EOTC YOUTH</div>
    <div class="footer-line"></div>
  </div>
</body>
</html>
