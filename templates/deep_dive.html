<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Deep Dive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #030408;
      --bg-deep: #070910;
      --bg-mid: #0d1018;
      --gold-50: #fdf8e8;
      --gold-100: #f7ecbf;
      --gold-200: #f0d890;
      --gold-300: #e8c25e;
      --gold-400: #d4af37;
      --gold-500: #b8962e;
      --gold-600: #8a7122;
      --gold-700: #5c4b17;
      --gold-glow: rgba(212, 175, 55, 0.20);
      --gold-glow-soft: rgba(212, 175, 55, 0.08);
      --gold-glow-strong: rgba(212, 175, 55, 0.45);
      --blue-accent: rgba(30, 58, 138, 0.15);
      --white: #ffffff;
      --white-95: rgba(255, 255, 255, 0.95);
      --white-90: rgba(255, 255, 255, 0.90);
      --white-70: rgba(255, 255, 255, 0.70);
      --white-50: rgba(255, 255, 255, 0.50);
      --white-40: rgba(255, 255, 255, 0.40);
      --white-20: rgba(255, 255, 255, 0.20);
      --white-12: rgba(255, 255, 255, 0.12);
      --white-08: rgba(255, 255, 255, 0.08);
      --white-06: rgba(255, 255, 255, 0.06);
      --white-04: rgba(255, 255, 255, 0.04);
      --white-03: rgba(255, 255, 255, 0.03);

      --mood-primary: #d4af37;
      --mood-primary-light: #f0d890;
      --mood-primary-dim: #8a7122;
      --mood-glow: rgba(212, 175, 55, 0.20);
      --mood-bg-accent: rgba(212, 175, 55, 0.06);
      --mood-accent-secondary: rgba(212, 175, 55, 0.05);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes breathe {
      0%, 100% { opacity: 0.50; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.80; transform: translate(-50%, -50%) scale(1.06); }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    html {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1;
    }

    body {
      width: 1080px;
      height: 1350px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden;
      position: relative;
      background: var(--bg-void);
    }

    
    /* === LALIBELA CROSS BRAND === */
    .brand-lalibela { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .brand-lalibela img { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="atmos-primary"></div>
  <div class="atmos-bloom-tl"></div>
  <div class="atmos-bloom-br"></div>
  <div class="light-beam"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="sacred-watermark">✝</div>

  

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="main-content">
    <div class="card">
      <div class="card-accent"></div>
      <div class="card-accent-bottom"></div>
      <div class="floating-badge" id="topic-badge">ክፍል</div>

      <div class="header-row">
        <div class="slide-indicator">
          <div class="slide-number-box" id="slide-number">1</div>
          <div class="slide-total" id="slide-total">OF 5</div>
        </div>
      </div>

      <div class="title-section">
        <h1 class="title" id="title">ርዕስ ይገባል</h1>
        <div class="title-underline"></div>
      </div>

      <div class="content-box">
        <p class="quote-text" id="quote-text">።።።</p>

        <div class="reference-box" id="reference-box" style="display: none;">
          <span class="reference-text" id="scripture-ref"></span>
        </div>
      </div>

      <div class="separator">
        <div class="sep-line"></div>
        <div class="sep-icon">✦</div>
        <div class="sep-line"></div>
      </div>

      <div class="footer">
        <div class="brand-group">
          <div class="brand-lalibela"><img src="../assets/vectors/lalibela_cross.svg" alt="Lalibela Cross"></div>
          <div class="brand-name">EOTC <span style="color: var(--mood-primary);">Youth</span></div>
        </div>

        <div class="dots-container" id="progress-dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar" style="width: 20%"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const ref = document.getElementById('scripture-ref');
      const refBox = document.getElementById('reference-box');
      if(ref && ref.textContent.trim().length > 0) {
        refBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
