<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Deep Dive Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void:    #010206;
      --bg-deep:    #050811;
      --bg-card:    #0a0f1d;
      --gold-50:    #fdf8e8;
      --gold-100:   #f7ecbf;
      --gold-200:   #f0d890;
      --gold-400:   #d4af37;
      --gold-500:   #b8962e;
      --gold-600:   #8a7122;
      --gold-glow:  rgba(212, 175, 55, 0.28);
      --gold-glow-soft: rgba(212, 175, 55, 0.10);
      --white:      #ffffff;
      --white-95:   rgba(255, 255, 255, 0.95);
      --white-85:   rgba(255, 255, 255, 0.85);
      --white-70:   rgba(255, 255, 255, 0.70);
      --white-40:   rgba(255, 255, 255, 0.40);
      --white-12:   rgba(255, 255, 255, 0.12);
      --white-06:   rgba(255, 255, 255, 0.06);

      --mood-primary:       #d4af37;
      --mood-primary-light: #f0d890;
      --mood-primary-dim:   #8a7122;
      --mood-glow:          rgba(212, 175, 55, 0.28);
      --mood-bg-accent:     rgba(212, 175, 55, 0.08);
      --mood-accent-secondary: rgba(212, 175, 55, 0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @keyframes haloGlow {
      0%, 100% { opacity: 0.45; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 0.85; transform: translate(-50%, -50%) scale(1.06); }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1.0; }
    }

    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden;
      position: relative;
      background: var(--bg-void);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--white);
    }

    /* ══ ASPECT RATIO PROFILES ══ */
    body.aspect-1-1 {
      width: 1080px;
      height: 1080px;
    }
    body.aspect-9-16 {
      width: 1080px;
      height: 1920px;
    }
    body.aspect-4-5 {
      width: 1080px;
      height: 1350px;
    }

    /* ══ BACKGROUND LIGHTING & TEXTURE ══ */
    .bg-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 50% 25%, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
        linear-gradient(175deg, #020307 0%, #060912 40%, #090e1c 100%);
      z-index: 0;
    }

    .ambient-halo {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 760px;
      height: 760px;
      background: radial-gradient(circle, var(--gold-glow-soft) 0%, transparent 68%);
      border-radius: 50%;
      z-index: 0;
      animation: haloGlow 10s ease-in-out infinite;
      filter: blur(20px);
    }

    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.026'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }

    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.70) 100%);
      z-index: 1; pointer-events: none;
    }

    /* ══ GEOMETRIC GOLD CORNER ACCENTS ══ */
    .corner {
      position: absolute; width: 36px; height: 36px;
      border-color: rgba(212, 175, 55, 0.40);
      border-style: solid; z-index: 2;
    }
    .corner.tl { top: 32px; left: 32px; border-width: 2px 0 0 2px; }
    .corner.tr { top: 32px; right: 32px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: 32px; left: 32px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: 32px; right: 32px; border-width: 0 2px 2px 0; }

    /* ══ MAIN CONTAINER ══ */
    .carousel-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 68px 84px 58px;
    }

    /* Vertical 9:16 spacing adjustments */
    body.aspect-9-16 .carousel-container {
      padding: 120px 84px 90px;
    }
    body.aspect-4-5 .carousel-container {
      padding: 88px 84px 70px;
    }

    /* ══ TOP BAR: CATEGORY / ETHIOPIAN DATE ══ */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .topic-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 8px 24px;
      border-radius: 24px;
      font-size: 13px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--gold-200);
      font-family: 'Cinzel', serif;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.12);
    }

    .eth-date {
      font-size: 13px;
      letter-spacing: 0.14em;
      color: var(--gold-200);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--white-12);
      padding: 6px 18px;
      border-radius: 16px;
    }

    /* ══ HERO HEADLINE ZONE ══ */
    .header-zone {
      margin-bottom: 24px;
    }

    .slide-prefix {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 8px;
    }

    .num-large {
      font-family: 'Cinzel', serif;
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
      color: var(--gold-400);
      text-shadow: 0 0 28px var(--gold-glow);
    }

    body.aspect-9-16 .num-large {
      font-size: 72px;
    }

    .title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 30%, var(--gold-200) 65%, #ffffff 95%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 18px rgba(0,0,0,0.6));
      letter-spacing: -0.01em;
    }

    body.aspect-9-16 .title {
      font-size: 64px;
      line-height: 1.22;
    }

    /* ══ CENTER HERO VISUAL ANCHOR: ILLUMINATED MANUSCRIPT WINDOW ══ */
    .hero-visual-card {
      position: relative;
      background: linear-gradient(165deg, rgba(14, 21, 38, 0.85) 0%, rgba(6, 10, 20, 0.95) 100%);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 38px 46px;
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 0 30px rgba(212, 175, 55, 0.12);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 12px 0 24px;
    }

    body.aspect-9-16 .hero-visual-card {
      padding: 56px 48px;
      margin: 20px 0 36px;
    }

    /* Subtle Lalibela cross watermark in center card */
    .hero-visual-card::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 220px; height: 220px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='48' y='5' width='24' height='110' rx='3' fill='%23d4af37'/%3E%3Crect x='5' y='48' width='110' height='24' rx='3' fill='%23d4af37'/%3E%3Ccircle cx='60' cy='60' r='18' fill='%23d4af37'/%3E%3C/svg%3E");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.035;
      pointer-events: none;
    }

    .body-text {
      font-size: 34px;
      font-weight: 600;
      line-height: 1.68;
      color: var(--white-95);
      letter-spacing: 0.01em;
      position: relative;
      z-index: 2;
    }

    body.aspect-9-16 .body-text {
      font-size: 42px;
      line-height: 1.72;
    }

    .reference-badge {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      margin-top: 24px;
      gap: 10px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.40);
      padding: 8px 22px;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 700;
      color: var(--gold-200);
      position: relative;
      z-index: 2;
    }

    /* ══ FOOTER BAR: BRAND + PROGRESS DOTS ══ */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(212, 175, 55, 0.18);
      padding-top: 24px;
      position: relative;
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-cross {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.65));
    }
    .brand-cross svg { width: 100%; height: 100%; }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.46em;
      font-weight: 800;
      color: var(--white-70);
      text-transform: uppercase;
    }
    .brand-gold { color: var(--gold-400); }

    /* Clean progress dots */
    .dots-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .dot.active {
      width: 28px;
      height: 10px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--gold-400), var(--gold-200));
      box-shadow: 0 0 14px var(--gold-glow);
    }

    /* Hidden hook IDs preserved for puppeteer compatibility */
    #slide-number, #slide-total, #progress-bar { display: none; }
  </style>
</head>
<body class="aspect-1-1">
  <div class="bg-canvas"></div>
  <div class="ambient-halo"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <!-- Geometric Brass Corners -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Hidden hooks for puppeteer data injection -->
  <div id="slide-number">1</div>
  <div id="slide-total">1 OF 5</div>
  <div id="progress-bar"></div>

  <div class="carousel-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="topic-pill" id="topic-badge">ክፍል</div>
      <div class="eth-date" id="eth-date-badge"></div>
    </div>

    <!-- Title & Chapter Header -->
    <div class="header-zone">
      <div class="slide-prefix">
        <span class="num-large" id="display-number">፩</span>
      </div>
      <h1 class="title" id="title">ርዕስ ይገባል</h1>
    </div>

    <!-- Center Hero Card: Illuminated Parchment Window -->
    <div class="hero-visual-card">
      <p class="body-text" id="quote-text">።።።</p>

      <div class="reference-badge" id="reference-box" style="display: none;">
        <span>✝</span>
        <span id="scripture-ref"></span>
      </div>
    </div>

    <!-- Bottom Footer Bar -->
    <div class="footer-bar">
      <div class="brand-section">
        <div class="brand-cross">
          <!-- Authentic Lalibela Cross SVG -->
          <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lcross" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fdf8e8"/>
                <stop offset="50%" stop-color="#f0d890"/>
                <stop offset="100%" stop-color="#b8962e"/>
              </linearGradient>
            </defs>
            <rect x="48" y="5" width="24" height="110" rx="2.5" fill="url(#lcross)"/>
            <rect x="5" y="48" width="110" height="24" rx="2.5" fill="url(#lcross)"/>
            <rect x="35" y="19" width="50" height="13" rx="2" fill="url(#lcross)"/>
            <rect x="35" y="88" width="50" height="13" rx="2" fill="url(#lcross)"/>
            <rect x="19" y="35" width="13" height="50" rx="2" fill="url(#lcross)"/>
            <rect x="88" y="35" width="13" height="50" rx="2" fill="url(#lcross)"/>
            <circle cx="60" cy="60" r="19" fill="url(#lcross)"/>
            <circle cx="60" cy="60" r="11" fill="#04060d"/>
            <circle cx="60" cy="60" r="5.5" fill="url(#lcross)"/>
          </svg>
        </div>
        <div class="brand-title">EOTC <span class="brand-gold">Youth</span></div>
      </div>

      <div class="dots-row" id="progress-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
    const GEEZ_NUMS = ['፩', '፪', '፫', '፬', '፭', '፮', '፯', '፰', '፱', '፲'];
    document.addEventListener("DOMContentLoaded", () => {
      const observer = new MutationObserver(() => {
        const numEl = document.getElementById('slide-number');
        const dispEl = document.getElementById('display-number');
        if (numEl && dispEl) {
          const val = parseInt(numEl.textContent.trim(), 10);
          if (!isNaN(val) && val >= 1 && val <= GEEZ_NUMS.length) {
            dispEl.textContent = GEEZ_NUMS[val - 1] + '.';
          } else if (!isNaN(val)) {
            dispEl.textContent = val + '.';
          }
        }
      });
      const numEl = document.getElementById('slide-number');
      if (numEl) {
        observer.observe(numEl, { childList: true, characterData: true, subtree: true });
        const val = parseInt(numEl.textContent.trim(), 10);
        if (!isNaN(val) && val >= 1 && val <= GEEZ_NUMS.length) {
          document.getElementById('display-number').textContent = GEEZ_NUMS[val - 1] + '.';
        }
      }
    });
  </script>
</body>
</html>
