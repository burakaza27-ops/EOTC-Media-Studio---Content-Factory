<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Deep Dive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #030408;
      --bg-deep: #070910;
      --bg-mid: #0d1018;
      --gold-50: #fdf8e8;
      --gold-100: #f7ecbf;
      --gold-200: #f0d890;
      --gold-300: #e8c25e;
      --gold-400: #d4af37;
      --gold-500: #b8962e;
      --gold-600: #8a7122;
      --gold-700: #5c4b17;
      --gold-glow: rgba(212, 175, 55, 0.20);
      --gold-glow-soft: rgba(212, 175, 55, 0.08);
      --gold-glow-strong: rgba(212, 175, 55, 0.45);
      --blue-accent: rgba(30, 58, 138, 0.15);
      --white: #ffffff;
      --white-95: rgba(255, 255, 255, 0.95);
      --white-90: rgba(255, 255, 255, 0.90);
      --white-70: rgba(255, 255, 255, 0.70);
      --white-50: rgba(255, 255, 255, 0.50);
      --white-40: rgba(255, 255, 255, 0.40);
      --white-20: rgba(255, 255, 255, 0.20);
      --white-12: rgba(255, 255, 255, 0.12);
      --white-08: rgba(255, 255, 255, 0.08);
      --white-06: rgba(255, 255, 255, 0.06);
      --white-04: rgba(255, 255, 255, 0.04);
      --white-03: rgba(255, 255, 255, 0.03);

      --mood-primary: #d4af37;
      --mood-primary-light: #f0d890;
      --mood-primary-dim: #8a7122;
      --mood-glow: rgba(212, 175, 55, 0.20);
      --mood-bg-accent: rgba(212, 175, 55, 0.06);
      --mood-accent-secondary: rgba(212, 175, 55, 0.05);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes breathe {
      0%, 100% { opacity: 0.50; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.80; transform: translate(-50%, -50%) scale(1.06); }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    html {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1;
    }

    body {
      width: 1080px;
      height: 1350px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden;
      position: relative;
      background: var(--bg-void);
    }

    /* ═══ ATMOSPHERIC BACKGROUND SYSTEM ═══ */

    .atmos-primary {
      position: absolute;
      width: 800px; height: 800px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--mood-glow) 0%, rgba(212, 175, 55, 0.03) 35%, transparent 65%);
      border-radius: 50%;
      z-index: 0;
      animation: breathe 10s ease-in-out infinite;
    }

    .atmos-bloom-tl {
      position: absolute;
      top: -5%; left: -5%;
      width: 500px; height: 500px;
      background: radial-gradient(ellipse at center, var(--mood-bg-accent) 0%, transparent 60%);
      z-index: 0;
    }

    .atmos-bloom-br {
      position: absolute;
      bottom: -8%; right: -8%;
      width: 450px; height: 450px;
      background: radial-gradient(ellipse at center, var(--blue-accent) 0%, transparent 60%);
      z-index: 0;
    }

    .bg-gradient {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(155deg, var(--bg-void) 0%, var(--bg-deep) 40%, var(--bg-mid) 100%);
      z-index: 0;
    }

    .light-beam {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 360px; height: 100%;
      background: linear-gradient(180deg, var(--mood-bg-accent) 0%, transparent 25%, transparent 75%, var(--mood-accent-secondary) 100%);
      z-index: 0; pointer-events: none;
      opacity: 0.6;
    }

    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.024'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }

    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
      z-index: 1; pointer-events: none;
    }

    .sacred-watermark {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 660px;
      color: rgba(255, 255, 255, 0.010);
      font-family: serif;
      pointer-events: none;
      z-index: 1;
      line-height: 1;
    }

    /* ═══ FRAME SYSTEM ═══ */
    .frame-outer {
      position: absolute; top: 42px; left: 42px; right: 42px; bottom: 42px;
      border: 1px solid rgba(212, 175, 55, 0.10);
      pointer-events: none; z-index: 2;
    }

    .frame-outer::before, .frame-outer::after {
      content: ''; position: absolute; width: 32px; height: 32px;
    }
    .frame-outer::before {
      top: -1px; left: -1px;
      border-top: 2.5px solid var(--mood-primary);
      border-left: 2.5px solid var(--mood-primary);
    }
    .frame-outer::after {
      bottom: -1px; right: -1px;
      border-bottom: 2.5px solid var(--mood-primary);
      border-right: 2.5px solid var(--mood-primary);
    }

    .corner-tr {
      position: absolute; top: -1px; right: -1px;
      width: 32px; height: 32px;
      border-top: 2.5px solid var(--mood-primary);
      border-right: 2.5px solid var(--mood-primary);
    }
    .corner-bl {
      position: absolute; bottom: -1px; left: -1px;
      width: 32px; height: 32px;
      border-bottom: 2.5px solid var(--mood-primary);
      border-left: 2.5px solid var(--mood-primary);
    }

    .inner-ring {
      position: absolute;
      top: 52px; left: 52px; right: 52px; bottom: 52px;
      border: 1px solid rgba(212, 175, 55, 0.04);
      pointer-events: none; z-index: 2;
    }

    /* ═══ MAIN CONTENT ═══ */
    .main-content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 100px 90px 90px;
    }

    /* Glassmorphic card */
    .card {
      width: 100%;
      background: linear-gradient(152deg, rgba(28, 30, 40, 0.70), rgba(12, 14, 20, 0.80));
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(212, 175, 55, 0.16);
      border-radius: 8px;
      padding: 65px 80px 55px;
      position: relative;
      box-shadow:
        0 60px 120px rgba(0,0,0,0.65),
        0 20px 40px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.4);
      animation: floatCard 14s ease-in-out infinite;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-accent {
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--mood-primary-light), var(--mood-primary), var(--mood-primary-light), transparent);
      box-shadow: 0 2px 16px rgba(212, 175, 55, 0.40);
    }

    .card-accent-bottom {
      position: absolute;
      bottom: 0; left: 18%; right: 18%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--mood-primary-dim), transparent);
    }

    /* ═══ HEADER ═══ */
    .header-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 40px;
    }

    .slide-indicator {
      display: flex; align-items: center; gap: 16px;
    }

    .slide-number-box {
      width: 72px; height: 72px;
      border: 2px solid var(--mood-primary);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: var(--mood-primary-light);
      background: var(--mood-bg-accent);
      box-shadow: 0 0 30px var(--mood-glow), inset 0 0 10px var(--mood-accent-secondary);
    }

    .slide-total {
      font-size: 13px; letter-spacing: 0.35em;
      color: var(--white-50); text-transform: uppercase; font-weight: 700;
    }

    .topic-tag {
      background: linear-gradient(180deg, rgba(24, 26, 36, 0.85), rgba(16, 18, 26, 0.85));
      border: 1px solid var(--mood-accent-secondary);
      padding: 10px 28px; border-radius: 30px;
      font-size: 12px; letter-spacing: 0.26em; color: var(--mood-primary-light);
      text-transform: uppercase; font-weight: 700;
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    }

    /* ═══ TITLE ═══ */
    .title-section {
      text-align: left; margin-bottom: 35px;
    }

    .title {
      font-size: 58px; font-weight: 900; line-height: 1.22;
      background: linear-gradient(to right, #ffffff 10%, var(--mood-primary-light) 40%, #ffffff 70%);
      background-clip: text;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.40));
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .title-underline {
      width: 100px; height: 3px;
      background: linear-gradient(90deg, var(--mood-primary), var(--mood-primary-dim), transparent);
      margin-top: 22px;
      border-radius: 2px;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.35);
    }

    /* ═══ CONTENT ═══ */
    .content-box {
      flex: 1;
    }

    .quote-text {
      font-size: 40px; font-weight: 600; line-height: 1.60;
      color: var(--white-90);
      position: relative; padding-left: 48px;
      border-left: 3px solid var(--mood-primary);
      text-shadow: 0 2px 5px rgba(0,0,0,0.22);
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .quote-text::before {
      content: '❝'; position: absolute; left: -24px; top: -22px;
      font-size: 65px; color: var(--mood-glow); font-family: Georgia, serif;
      line-height: 1;
    }

    .reference-box {
      margin-top: 40px; align-self: flex-start;
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.07), rgba(212, 175, 55, 0.02), transparent);
      padding: 14px 36px 14px 22px;
      border-left: 4px solid var(--mood-primary);
      box-shadow: 0 4px 20px rgba(0,0,0,0.20);
      display: inline-block;
    }

    .reference-text {
      font-size: 18px; color: var(--gold-100);
      letter-spacing: 0.10em; font-weight: 700;
    }

    /* ═══ SEPARATOR ═══ */
    .separator {
      margin: 32px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .sep-line {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--mood-primary-dim), transparent);
    }
    .sep-icon {
      color: var(--mood-primary);
      font-size: 14px;
      filter: drop-shadow(0 0 6px var(--mood-glow));
      animation: shimmer 5s ease-in-out infinite;
    }

    /* ═══ FOOTER ═══ */
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: auto; padding-top: 30px;
    }

    .brand-group {
      display: flex; align-items: center; gap: 14px;
    }

    .brand-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--mood-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--mood-primary);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.10);
    }

    .brand-name {
      font-size: 13px; letter-spacing: 0.40em; font-weight: 700;
      color: var(--white-70); text-transform: uppercase;
    }

    .dots-container {
      display: flex; gap: 10px;
    }

    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--white-06);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .dot.active {
      background: var(--mood-primary);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.50);
      transform: scale(1.25);
      border-color: transparent;
    }

    .progress-bar-container {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
      background: rgba(255,255,255,0.015); z-index: 20;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--mood-primary-dim), var(--mood-primary), var(--mood-primary-light));
      box-shadow: 0 0 12px var(--mood-glow);
      border-radius: 0 2px 2px 0;
    }

    .eth-date {
      position: absolute; top: 66px; right: 72px; z-index: 10;
      font-size: 12px; letter-spacing: 0.14em;
      color: var(--mood-primary-light); font-weight: 700;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 5px 16px; border-radius: 14px;
    }

    /* Floating theme badge above card */
    .floating-badge {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #181a24, #10121a);
      border: 1px solid var(--mood-accent-secondary);
      color: var(--mood-primary-light);
      padding: 8px 30px;
      border-radius: 28px;
      font-size: 12px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-weight: 700;
      box-shadow: 0 12px 36px rgba(0,0,0,0.55), 0 0 16px var(--mood-accent-secondary);
      white-space: nowrap;
    }

    /* === TIBEB BORDER === */
    .tibeb-top, .tibeb-bottom {
      position: absolute; left: 0; right: 0; z-index: 8;
      height: 48px; overflow: hidden; opacity: 0.55;
    }
    .tibeb-top    { top: 0; }
    .tibeb-bottom { bottom: 0; transform: scaleY(-1); }
    .tibeb-top img, .tibeb-bottom img { width: 100%; height: 48px; object-fit: cover; display: block; }
    /* === LALIBELA CROSS BRAND === */
    .brand-lalibela { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .brand-lalibela img { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="atmos-primary"></div>
  <div class="atmos-bloom-tl"></div>
  <div class="atmos-bloom-br"></div>
  <div class="light-beam"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="sacred-watermark">✝</div>

  <div class="frame-outer">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
  </div>
  <div class="inner-ring"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="main-content">
    <div class="card">
      <div class="card-accent"></div>
      <div class="card-accent-bottom"></div>
      <div class="floating-badge" id="topic-badge">ክፍል</div>

      <div class="header-row">
        <div class="slide-indicator">
          <div class="slide-number-box" id="slide-number">1</div>
          <div class="slide-total" id="slide-total">OF 5</div>
        </div>
      </div>

      <div class="title-section">
        <h1 class="title" id="title">ርዕስ ይገባል</h1>
        <div class="title-underline"></div>
      </div>

      <div class="content-box">
        <p class="quote-text" id="quote-text">።።።</p>

        <div class="reference-box" id="reference-box" style="display: none;">
          <span class="reference-text" id="scripture-ref"></span>
        </div>
      </div>

      <div class="separator">
        <div class="sep-line"></div>
        <div class="sep-icon">✦</div>
        <div class="sep-line"></div>
      </div>

      <div class="footer">
        <div class="brand-group">
          <div class="brand-lalibela"><img src="../assets/vectors/lalibela_cross.svg" alt="Lalibela Cross"></div>
          <div class="brand-name">EOTC <span style="color: var(--mood-primary);">Youth</span></div>
        </div>

        <div class="dots-container" id="progress-dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar" style="width: 20%"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const ref = document.getElementById('scripture-ref');
      const refBox = document.getElementById('reference-box');
      if(ref && ref.textContent.trim().length > 0) {
        refBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
