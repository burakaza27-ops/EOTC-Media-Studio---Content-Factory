<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Power Quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #010206;
      --bg-deep: #050910;
      --bg-mid:  #0b0f1a;
      --gold-50:  #fdf8e8;
      --gold-100: #f7ecbf;
      --gold-200: #f0d890;
      --gold-300: #e8c25e;
      --gold-400: #d4af37;
      --gold-500: #b8962e;
      --gold-600: #8a7122;
      --gold-glow:        rgba(212, 175, 55, 0.22);
      --gold-glow-soft:   rgba(212, 175, 55, 0.08);
      --gold-glow-strong: rgba(212, 175, 55, 0.48);
      --white:    #ffffff;
      --white-95: rgba(255,255,255,0.95);
      --white-70: rgba(255,255,255,0.70);
      --white-40: rgba(255,255,255,0.40);
      --white-12: rgba(255,255,255,0.12);
      --white-06: rgba(255,255,255,0.06);
      --white-03: rgba(255,255,255,0.03);
      --mood-primary:       #d4af37;
      --mood-primary-light: #f0d890;
      --mood-glow:          rgba(212, 175, 55, 0.22);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1;
    }

    @keyframes breathe {
      0%,100% { opacity: 0.50; transform: translate(-50%,-50%) scale(1);    }
      50%      { opacity: 0.85; transform: translate(-50%,-50%) scale(1.09); }
    }
    @keyframes shimmer {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 1;   }
    }
    @keyframes floatCard {
      0%,100% { transform: translateY(0);    }
      50%      { transform: translateY(-5px); }
    }
    @keyframes cornerPulse {
      0%,100% { border-color: rgba(212,175,55,0.38); }
      50%      { border-color: rgba(212,175,55,0.65); }
    }

    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Noto Sans Ethiopic', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: relative;
      background: var(--bg-void);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ══ BACKGROUNDS ══ */
    .atmos-gradient {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(158deg, var(--bg-void) 0%, var(--bg-deep) 38%, var(--bg-mid) 100%);
      z-index: 0;
    }
    .atmos-primary {
      position: absolute; width: 860px; height: 860px; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(212,175,55,0.14) 0%, rgba(212,175,55,0.04) 40%, transparent 68%);
      border-radius: 50%; z-index: 0; animation: breathe 12s ease-in-out infinite;
    }
    .atmos-bloom-tl {
      position: absolute; top: -8%; left: -8%; width: 620px; height: 620px;
      background: radial-gradient(ellipse at center, rgba(212,175,55,0.06) 0%, transparent 60%);
      border-radius: 50%; z-index: 0;
    }
    .atmos-bloom-br {
      position: absolute; bottom: -10%; right: -10%; width: 520px; height: 520px;
      background: radial-gradient(ellipse at center, rgba(30,58,138,0.08) 0%, transparent 60%);
      border-radius: 50%; z-index: 0;
    }
    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }
    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.62) 100%);
      z-index: 1; pointer-events: none;
    }

    /* ══ CARD ══ */
    .content-wrapper {
      position: relative; z-index: 10; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px;
    }
    .card {
      background: linear-gradient(148deg, rgba(18,22,36,0.80), rgba(8,11,20,0.90));
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(212,175,55,0.20);
      border-radius: 6px;
      padding: 80px 96px 72px;
      position: relative;
      box-shadow:
        0 90px 180px rgba(0,0,0,0.75),
        0 30px 60px rgba(0,0,0,0.40),
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.45);
      max-width: 940px;
      width: 100%;
      text-align: center;
      animation: floatCard 16s ease-in-out infinite;
    }

    /* Gold top accent line */
    .card-accent {
      position: absolute; top: 0; left: 8%; right: 8%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-300), var(--gold-400), var(--gold-300), transparent);
      box-shadow: 0 2px 20px var(--gold-glow-strong);
    }
    .card-accent-bottom {
      position: absolute; bottom: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-600), transparent);
    }

    /* Animated L-bracket corners on the card */
    .card-corner {
      position: absolute;
      width: 32px; height: 32px;
      border: 2px solid rgba(212,175,55,0.42);
      pointer-events: none;
      animation: cornerPulse 6s ease-in-out infinite;
    }
    .card-corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
    .card-corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
    .card-corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
    .card-corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

    /* Theme badge */
    .theme-badge {
      position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(180deg, #1a1d2c, #10121e);
      border: 1px solid rgba(212,175,55,0.28);
      color: var(--gold-200);
      padding: 8px 36px;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      font-weight: 700;
      font-family: 'Cinzel', serif;
      box-shadow: 0 12px 38px rgba(0,0,0,0.65), 0 0 22px rgba(212,175,55,0.08);
      white-space: nowrap;
    }

    /* Decorative quote mark */
    .quote-mark {
      position: absolute; top: -44px; left: 28px;
      font-size: 140px; color: rgba(212,175,55,0.10);
      font-family: Georgia,'Times New Roman',serif; line-height: 1;
      pointer-events: none;
    }

    /* Main quote text */
    .quote-text {
      font-size: clamp(36px, 5.0vw, 54px);
      font-weight: 800;
      line-height: 1.55;
      background: linear-gradient(148deg, #ffffff 20%, var(--gold-100) 50%, #ffffff 72%, var(--gold-200) 95%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative; z-index: 2;
      letter-spacing: 0.005em;
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
      overflow: hidden;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.40));
    }

    /* Ornamental separator */
    .separator {
      margin: 46px auto 0;
      display: flex; align-items: center; justify-content: center; gap: 18px;
    }
    .sep-line {
      width: 82px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-600), transparent);
    }
    .sep-icon {
      color: var(--gold-400); font-size: 17px;
      filter: drop-shadow(0 0 8px var(--gold-glow));
      animation: shimmer 6s ease-in-out infinite;
    }

    /* ══ FOOTER ══ */
    .footer {
      position: absolute; bottom: 68px; left: 76px; right: 76px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-cross svg { width: 36px; height: 36px; }
    .brand-text {
      font-size: 12px;
      letter-spacing: 0.50em;
      color: var(--white-70);
      text-transform: uppercase;
      font-weight: 700;
      font-family: 'Cinzel', serif;
    }
    .brand-gold { color: var(--gold-400); }
    .tag {
      font-size: 11px;
      letter-spacing: 0.44em;
      color: var(--gold-400);
      text-transform: uppercase;
      border: 1px solid rgba(212,175,55,0.20);
      padding: 8px 26px;
      border-radius: 22px;
      font-weight: 800;
      font-family: 'Cinzel', serif;
      background: rgba(212,175,55,0.03);
    }

    /* Ethiopian date badge */
    .eth-date {
      position: absolute; top: 65px; right: 68px; z-index: 10;
      font-size: 13px; letter-spacing: 0.16em;
      color: var(--gold-200); font-weight: 700;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 6px 18px; border-radius: 16px;
    }
  </style>
</head>
<body>
  <div class="atmos-gradient"></div>
  <div class="atmos-primary"></div>
  <div class="atmos-bloom-tl"></div>
  <div class="atmos-bloom-br"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content-wrapper">
    <div class="card">
      <div class="card-accent"></div>
      <div class="card-accent-bottom"></div>
      <div class="card-corner tl"></div>
      <div class="card-corner tr"></div>
      <div class="card-corner bl"></div>
      <div class="card-corner br"></div>
      <div class="theme-badge" id="theme-badge">መንፈሳዊ ቃል</div>
      <div class="quote-mark">❝</div>

      <p class="quote-text" id="quote-text">።።።</p>

      <div class="separator">
        <div class="sep-line"></div>
        <div class="sep-icon">✦</div>
        <div class="sep-line"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="brand">
      <div class="brand-cross">
        <!-- Inline Lalibela Cross SVG -->
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 0 7px rgba(212,175,55,0.6))">
          <defs>
            <linearGradient id="bcg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f0d890"/>
              <stop offset="100%" stop-color="#b8962e"/>
            </linearGradient>
          </defs>
          <rect x="48" y="5"  width="24" height="110" rx="2.5" fill="url(#bcg)"/>
          <rect x="5"  y="48" width="110" height="24" rx="2.5" fill="url(#bcg)"/>
          <rect x="35" y="19" width="50" height="13" rx="2" fill="url(#bcg)"/>
          <rect x="35" y="88" width="50" height="13" rx="2" fill="url(#bcg)"/>
          <rect x="19" y="35" width="13" height="50" rx="2" fill="url(#bcg)"/>
          <rect x="88" y="35" width="13" height="50" rx="2" fill="url(#bcg)"/>
          <circle cx="60" cy="60" r="19" fill="url(#bcg)"/>
          <circle cx="60" cy="60" r="11" fill="#05090e"/>
          <circle cx="60" cy="60" r="5.5" fill="url(#bcg)"/>
        </svg>
      </div>
      <div class="brand-text">EOTC <span class="brand-gold">Youth</span></div>
    </div>
    <div class="tag">መንፈሳዊ ኃይለ ቃል</div>
  </div>
</body>
</html>
