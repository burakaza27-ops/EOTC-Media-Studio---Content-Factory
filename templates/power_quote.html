<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Power Quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #020308;
      --bg-deep: #060910;
      --bg-mid: #0c1018;
      --gold-50: #fdf8e8;
      --gold-100: #f7ecbf;
      --gold-200: #f0d890;
      --gold-300: #e8c25e;
      --gold-400: #d4af37;
      --gold-500: #b8962e;
      --gold-600: #8a7122;
      --gold-700: #5c4b17;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --gold-glow-soft: rgba(212, 175, 55, 0.08);
      --gold-glow-strong: rgba(212, 175, 55, 0.45);
      --white: #ffffff;
      --white-95: rgba(255, 255, 255, 0.95);
      --white-70: rgba(255, 255, 255, 0.70);
      --white-40: rgba(255, 255, 255, 0.40);
      --white-12: rgba(255, 255, 255, 0.12);
      --white-06: rgba(255, 255, 255, 0.06);
      --white-03: rgba(255, 255, 255, 0.03);
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Noto Sans Ethiopic', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: relative;
      background: var(--bg-void);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ═══ ATMOSPHERIC BACKGROUND SYSTEM ═══ */

    /* Primary radial light — warm golden halo behind the card */
    .atmos-primary {
      position: absolute;
      width: 900px; height: 900px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(212, 175, 55, 0.04) 35%, transparent 65%);
      border-radius: 50%;
      z-index: 0;
      animation: breathe 10s ease-in-out infinite;
    }

    /* Directional light bloom — top-left accent */
    .atmos-bloom-tl {
      position: absolute;
      top: -5%; left: -5%;
      width: 600px; height: 600px;
      background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.07) 0%, transparent 60%);
      z-index: 0;
    }

    /* Directional light bloom — bottom-right accent */
    .atmos-bloom-br {
      position: absolute;
      bottom: -8%; right: -8%;
      width: 500px; height: 500px;
      background: radial-gradient(ellipse at center, rgba(30, 58, 138, 0.06) 0%, transparent 60%);
      z-index: 0;
    }

    /* Base gradient fill */
    .atmos-gradient {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(155deg, var(--bg-void) 0%, var(--bg-deep) 40%, var(--bg-mid) 100%);
      z-index: 0;
    }

    /* Film grain texture — adds analog depth */
    .grain {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.028'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }

    /* Cinematic vignette */
    .vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
      z-index: 1; pointer-events: none;
    }

    /* Giant watermark cross — barely visible sacred symbol */
    .sacred-watermark {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 720px;
      color: rgba(255, 255, 255, 0.012);
      font-family: serif;
      pointer-events: none;
      z-index: 1;
      line-height: 1;
    }

    /* ═══ ORNAMENTAL FRAME ═══ */
    .frame {
      position: absolute;
      top: 42px; left: 42px; right: 42px; bottom: 42px;
      border: 1px solid rgba(212, 175, 55, 0.12);
      pointer-events: none;
      z-index: 2;
    }

    /* Corner L-brackets */
    .frame::before, .frame::after {
      content: ''; position: absolute; width: 36px; height: 36px;
    }
    .frame::before {
      top: -1px; left: -1px;
      border-top: 2.5px solid var(--gold-400);
      border-left: 2.5px solid var(--gold-400);
    }
    .frame::after {
      bottom: -1px; right: -1px;
      border-bottom: 2.5px solid var(--gold-400);
      border-right: 2.5px solid var(--gold-400);
    }

    .corner-tr {
      position: absolute; top: -1px; right: -1px;
      width: 36px; height: 36px;
      border-top: 2.5px solid var(--gold-400);
      border-right: 2.5px solid var(--gold-400);
    }
    .corner-bl {
      position: absolute; bottom: -1px; left: -1px;
      width: 36px; height: 36px;
      border-bottom: 2.5px solid var(--gold-400);
      border-left: 2.5px solid var(--gold-400);
    }

    /* Inner decorative ring */
    .inner-ring {
      position: absolute;
      top: 52px; left: 52px; right: 52px; bottom: 52px;
      border: 1px solid rgba(212, 175, 55, 0.05);
      pointer-events: none;
      z-index: 2;
    }

    /* ═══ MAIN CONTENT ═══ */
    .content-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 110px;
    }

    /* Glassmorphic card container */
    .card {
      background: linear-gradient(152deg, rgba(28, 30, 40, 0.72), rgba(12, 14, 20, 0.82));
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-radius: 8px;
      padding: 75px 90px 65px;
      position: relative;
      box-shadow:
        0 80px 160px rgba(0,0,0,0.7),
        0 30px 60px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.07),
        inset 0 -1px 0 rgba(0,0,0,0.4);
      max-width: 860px;
      width: 100%;
      text-align: center;
      animation: floatCard 14s ease-in-out infinite;
    }

    /* Gold accent line at card top — the signature mark */
    .card-accent {
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-300), var(--gold-400), var(--gold-300), transparent);
      box-shadow: 0 2px 18px var(--gold-glow-strong);
    }

    /* Bottom accent — mirrored, subtler */
    .card-accent-bottom {
      position: absolute;
      bottom: 0; left: 18%; right: 18%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-600), transparent);
    }

    /* Theme badge — floating pill above the card */
    .theme-badge {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #181a24, #10121a);
      border: 1px solid rgba(212, 175, 55, 0.22);
      color: var(--gold-200);
      padding: 9px 34px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
      box-shadow: 0 14px 40px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.06);
      white-space: nowrap;
    }

    /* Decorative opening quote mark */
    .quote-mark {
      position: absolute;
      top: -48px;
      left: 32px;
      font-size: 150px;
      color: rgba(212, 175, 55, 0.12);
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1;
      pointer-events: none;
    }

    /* Main quote text — the hero element */
    .quote-text {
      font-size: clamp(34px, 4.8vw, 52px);
      font-weight: 800;
      line-height: 1.52;
      background: linear-gradient(145deg, #ffffff 25%, var(--gold-100) 50%, #ffffff 70%, var(--gold-200) 90%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      z-index: 2;
      letter-spacing: -0.005em;
      display: -webkit-box;
      -webkit-line-clamp: 7;
      -webkit-box-orient: vertical;
      overflow: hidden;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
    }

    /* Ornamental separator */
    .separator {
      margin: 45px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .sep-line {
      width: 80px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-600), transparent);
    }
    .sep-icon {
      color: var(--gold-400);
      font-size: 18px;
      filter: drop-shadow(0 0 8px var(--gold-glow));
      animation: shimmer 5s ease-in-out infinite;
    }

    /* ═══ FOOTER ═══ */
    .footer {
      position: absolute;
      bottom: 72px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--gold-400);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--gold-400);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.12);
    }
    .brand-text {
      font-size: 13px;
      letter-spacing: 0.45em;
      color: var(--white-70);
      text-transform: uppercase;
      font-weight: 700;
    }
    .brand-gold {
      color: var(--gold-400);
    }

    .tag {
      font-size: 12px;
      letter-spacing: 0.42em;
      color: var(--gold-400);
      text-transform: uppercase;
      border: 1px solid rgba(212, 175, 55, 0.18);
      padding: 8px 24px;
      border-radius: 22px;
      font-weight: 800;
      background: rgba(212, 175, 55, 0.03);
    }
  </style>
</head>
<body>
  <div class="atmos-gradient"></div>
  <div class="atmos-primary"></div>
  <div class="atmos-bloom-tl"></div>
  <div class="atmos-bloom-br"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="sacred-watermark">✝</div>

  <div class="frame">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
  </div>
  <div class="inner-ring"></div>

  <div class="content-wrapper">
    <div class="card">
      <div class="card-accent"></div>
      <div class="card-accent-bottom"></div>
      <div class="theme-badge" id="theme-badge">መንፈሳዊ ቃል</div>
      <div class="quote-mark">❝</div>
      
      <p class="quote-text" id="quote-text">።።።</p>
      
      <div class="separator">
        <div class="sep-line"></div>
        <div class="sep-icon">✦</div>
        <div class="sep-line"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="brand">
      <div class="brand-icon">✝</div>
      <div class="brand-text">EOTC <span class="brand-gold">Youth</span></div>
    </div>
    <div class="tag">Daily Inspiration</div>
  </div>
</body>
</html>
