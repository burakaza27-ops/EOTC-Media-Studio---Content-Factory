<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Holy Week</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void:   #050008;
      --bg-deep:   #0a0010;
      --crimson:   rgba(120,10,20,0.30);
      --gold:      #d4af37;
      --gold-lt:   #f0d890;
      --gold-pale: #fdf8e8;
      --gold-glow: rgba(212,175,55,0.25);
      --mood-primary:       #d4af37;
      --mood-primary-light: #f0d890;
      --mood-glow:          rgba(212,175,55,0.25);
      --mood-bg-accent:     rgba(212,175,55,0.07);
      --white:    #ffffff;
      --white-90: rgba(255,255,255,0.90);
      --white-70: rgba(255,255,255,0.70);
      --white-06: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    @keyframes breatheCrimson {
      0%,100% { opacity: 0.40; transform: translate(-50%,-50%) scale(1);    }
      50%      { opacity: 0.75; transform: translate(-50%,-50%) scale(1.08); }
    }
    @keyframes shimmer { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

    body {
      width: 1080px; height: 1350px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden; position: relative;
      background: var(--bg-void);
    }

    /* ══ BACKGROUNDS ══ */
    .bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(120,10,20,0.28) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 80%, rgba(212,175,55,0.08) 0%, transparent 45%),
        linear-gradient(168deg, var(--bg-void) 0%, var(--bg-deep) 50%, #0e0012 100%);
      z-index: 0;
    }
    .glow-top {
      position: absolute; top: -5%; left: 50%; transform: translateX(-50%);
      width: 700px; height: 600px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(120,10,20,0.20) 0%, transparent 60%);
      animation: breatheCrimson 13s ease-in-out infinite; filter: blur(50px); z-index: 0;
    }
    .grain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.030'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }
    .vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.68) 100%);
      z-index: 1; pointer-events: none;
    }

    /* ══ DATE BADGE ══ */
    .eth-date {
      position: absolute; top: 62px; right: 68px; z-index: 10;
      font-size: 13px; letter-spacing: 0.16em; color: var(--gold-lt); font-weight: 700;
      background: rgba(255,255,255,0.03); border: 1px solid var(--white-06);
      padding: 6px 18px; border-radius: 16px;
    }

    /* ══ CONTENT ══ */
    .content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 100px 90px;
    }

    /* Header */
    .holy-badge {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.38em; font-weight: 700;
      color: var(--gold-lt); text-transform: uppercase;
      border: 1px solid rgba(212,175,55,0.28); padding: 8px 28px; border-radius: 24px;
      background: rgba(212,175,55,0.05); margin-bottom: 30px;
      font-family: 'Cinzel', serif;
    }
    .day-name {
      font-size: 72px; font-weight: 900; line-height: 1.20;
      background: linear-gradient(to right, #ffffff 10%, var(--gold-lt) 50%, #ffffff 90%);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.55));
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 14px;
    }
    .day-subtitle {
      font-size: 26px; font-weight: 600; color: rgba(212,175,55,0.75);
      letter-spacing: 0.06em; margin-bottom: 40px;
    }

    /* Separator */
    .sep {
      display: flex; align-items: center; gap: 14px; width: 380px; margin-bottom: 44px;
    }
    .sep-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(212,175,55,0.60), transparent);
    }
    .sep-line:last-child { background: linear-gradient(90deg, transparent, rgba(212,175,55,0.60)); }
    .sep-dot {
      font-size: 14px; color: var(--gold); animation: shimmer 5s ease-in-out infinite;
      filter: drop-shadow(0 0 8px var(--gold-glow));
    }

    /* Teaching text */
    .teaching-text {
      font-size: 28px; font-weight: 500; line-height: 1.72;
      color: var(--white-90); margin-bottom: 36px;
      display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Scripture */
    .scripture-block {
      background: rgba(212,175,55,0.06);
      border-left: 3px solid var(--gold);
      border-radius: 0 8px 8px 0;
      padding: 26px 32px; flex: 1;
    }
    .scripture-text {
      font-size: 26px; font-weight: 600; line-height: 1.65;
      color: var(--gold-lt);
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 14px;
    }
    .scripture-ref-text {
      font-size: 18px; font-weight: 700;
      color: rgba(212,175,55,0.65); letter-spacing: 0.12em;
    }

    /* Footer */
    .footer {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; margin-top: auto; padding-top: 36px;
    }
    .footer-line {
      flex: 1; max-width: 180px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.38), transparent);
    }
    .footer-text {
      font-size: 12px; letter-spacing: 0.44em; font-weight: 700;
      color: rgba(212,175,55,0.55); text-transform: uppercase;
      font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="glow-top"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="holy-badge">Holy Week</div>
    <div class="day-name" id="day-name">ዓርብ ዐቢይ</div>
    <div class="day-subtitle" id="day-subtitle">።።።</div>

    <div class="sep">
      <div class="sep-line"></div>
      <div class="sep-dot">✦</div>
      <div class="sep-line"></div>
    </div>

    <div class="teaching-text" id="teaching-text">።።።</div>

    <div class="scripture-block">
      <div class="scripture-text" id="scripture-text">።።།</div>
      <div class="scripture-ref-text" id="scripture-ref">ማጣቀሻ</div>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">ሰሙነ ሕማማት • EOTC YOUTH</div>
      <div class="footer-line"></div>
    </div>
  </div>
</body>
</html>
