<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Holy Week</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #080204;
      --bg-deep: #120408;
      --mood-primary: #9b72cf;
      --mood-primary-light: #c4a8e0;
      --mood-primary-dim: #6b4d8a;
      --mood-glow: rgba(155, 114, 207, 0.22);
      --crimson: #8b1a1a;
      --crimson-glow: rgba(139, 26, 26, 0.20);
      --white: #ffffff;
      --white-90: rgba(255, 255, 255, 0.90);
      --white-60: rgba(255, 255, 255, 0.60);
      --white-30: rgba(255, 255, 255, 0.30);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1, "liga" 1; }

    body {
      width: 1080px; height: 1350px;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden; position: relative;
      background: var(--bg-void);
    }

    .bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 50% 20%, var(--crimson-glow) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, var(--mood-glow) 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-void) 0%, var(--bg-deep) 50%, #0a0210 100%);
      z-index: 0;
    }

    .grain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E"); z-index: 1; pointer-events: none; }
    .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.55) 100%); z-index: 1; pointer-events: none; }

    /* Large background cross */
    .bg-cross {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 600px; color: rgba(139, 26, 26, 0.04);
      font-family: serif; z-index: 1; pointer-events: none;
    }

    .eth-date { position: absolute; top: 72px; right: 76px; z-index: 10; font-size: 13px; letter-spacing: 0.15em; color: var(--mood-primary-light); font-weight: 700; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 6px 18px; border-radius: 16px; }

    .content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 110px 90px;
      text-align: center;
    }

    .week-badge {
      font-size: 12px; letter-spacing: 0.4em;
      color: var(--crimson); text-transform: uppercase; font-weight: 800;
      border: 1px solid rgba(139, 26, 26, 0.3);
      padding: 8px 26px; border-radius: 22px;
      background: rgba(139, 26, 26, 0.06);
      margin-bottom: 40px;
    }

    .day-name {
      font-size: 60px; font-weight: 900; line-height: 1.22;
      background: linear-gradient(140deg, var(--white) 20%, var(--mood-primary-light) 50%, var(--white) 80%);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.45));
      margin-bottom: 10px;
    }

    .day-subtitle {
      font-size: 22px; font-weight: 500; color: var(--white-60);
      letter-spacing: 0.08em; margin-bottom: 50px;
    }

    .sep { display: flex; align-items: center; gap: 18px; margin-bottom: 45px; }
    .sep-line { width: 70px; height: 1px; background: linear-gradient(90deg, transparent, rgba(139,26,26,0.35), transparent); }
    .sep-cross { font-size: 20px; color: var(--crimson); }

    .scripture-block {
      border-left: 3px solid var(--mood-primary-dim);
      padding: 20px 0 20px 40px;
      text-align: left; max-width: 800px; margin-bottom: 40px;
    }

    .scripture-text {
      font-size: 28px; font-weight: 600; line-height: 1.60;
      color: var(--white-90); font-style: italic;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }

    .scripture-ref {
      margin-top: 14px; font-size: 18px; font-weight: 800;
      color: var(--mood-primary-light); letter-spacing: 0.1em;
    }

    .teaching {
      font-size: 24px; font-weight: 500; line-height: 1.58;
      color: var(--white-60); max-width: 780px;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }

    .footer { position: absolute; bottom: 68px; display: flex; align-items: center; gap: 14px; z-index: 10; }
    .footer-line { width: 45px; height: 1px; background: linear-gradient(90deg, transparent, var(--mood-primary-dim), transparent); }
    .footer-text { font-size: 13px; letter-spacing: 0.4em; color: var(--white-30); text-transform: uppercase; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="bg-cross">✝</div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="week-badge">ሰሙነ ሕማማት — HOLY WEEK</div>
    <h1 class="day-name" id="day-name">ስቅለት</h1>
    <p class="day-subtitle" id="day-subtitle">Good Friday — The Crucifixion</p>

    <div class="sep">
      <div class="sep-line"></div>
      <div class="sep-cross">✝</div>
      <div class="sep-line"></div>
    </div>

    <div class="scripture-block">
      <p class="scripture-text" id="scripture-text">።።።</p>
      <div class="scripture-ref" id="scripture-ref">ማጣቀሻ</div>
    </div>

    <p class="teaching" id="teaching-text">።።።</p>
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-text">Holy Week • EOTC Youth</div>
    <div class="footer-line"></div>
  </div>
</body>
</html>
