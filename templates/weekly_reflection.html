<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Weekly Reflection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-ivory: #faf8f4;
      --bg-cream: #f5f2ec;
      --bg-warm: #eeebe4;
      --gold: #b8860b;
      --gold-light: #d4a418;
      --gold-pale: #e8c25e;
      --gold-dim: rgba(184, 134, 11, 0.55);
      --gold-glow: rgba(184, 134, 11, 0.10);
      --gold-glow-strong: rgba(184, 134, 11, 0.18);
      --ink: #0f1419;
      --ink-body: #2d3340;
      --ink-muted: #6b7280;
      --ink-faint: rgba(0, 0, 0, 0.06);
      --ink-hairline: rgba(0, 0, 0, 0.04);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1;
    }

    body {
      width: 1080px;
      min-height: 1920px;
      height: auto;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      background: var(--bg-ivory);
      position: relative;
    }

    
    /* === LALIBELA CROSS BRAND === */
    .brand-lalibela { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .brand-lalibela img { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="paper-texture"></div>
  
  <div class="ornament-bottom">✦</div>
  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="header">
      <div class="week-tag">የሳምንቱ መንፈሳዊ ትምህርት</div>
      <h1 class="title" id="title">ርዕስ</h1>
      <div class="title-ornament">
        <div class="title-ornament-line"></div>
        <div class="title-ornament-icon">◆</div>
        <div class="title-ornament-line"></div>
      </div>
    </div>

    <div class="scripture-highlight">
      <span id="scripture-text">የመጽሐፍ ቅዱስ ቃል...</span>
      <span class="scripture-ref" id="scripture-ref">ማጣቀሻ</span>
    </div>

    <div class="reflection-body" id="reflection-body">
      <p>ማብራሪያ...</p>
    </div>

    <div class="prayer-section">
      <div class="prayer-label">ጸሎት</div>
      <div class="prayer-text" id="prayer-text">አቤቱ አምላካችን...</div>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <span class="logo-cross">✝</span>
      <span class="brand">EOTC Media Studio</span>
      <div class="footer-line"></div>
    </div>
  </div>
</body>
</html>
