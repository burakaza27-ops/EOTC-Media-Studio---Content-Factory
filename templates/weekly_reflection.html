<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Weekly Reflection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void:  #010208;
      --bg-deep:  #06091a;
      --teal:     rgba(20,80,100,0.25);
      --gold:     #d4af37;
      --gold-lt:  #f0d890;
      --gold-pale:#fdf8e8;
      --gold-glow:rgba(212,175,55,0.22);
      --mood-primary:       #d4af37;
      --mood-primary-light: #f0d890;
      --mood-glow:          rgba(212,175,55,0.22);
      --mood-bg-accent:     rgba(212,175,55,0.06);
      --white:    #ffffff;
      --white-90: rgba(255,255,255,0.90);
      --white-70: rgba(255,255,255,0.70);
      --white-50: rgba(255,255,255,0.50);
      --white-08: rgba(255,255,255,0.08);
      --white-06: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    @keyframes breathe {
      0%,100% { opacity: 0.45; transform: translate(-50%,-50%) scale(1);    }
      50%      { opacity: 0.80; transform: translate(-50%,-50%) scale(1.06); }
    }
    @keyframes shimmer { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

    body {
      width: 1080px; min-height: 1920px; height: auto;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      background: var(--bg-void);
      position: relative; overflow-x: hidden;
    }

    /* ══ BACKGROUNDS ══ */
    .bg-gradient {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(162deg, var(--bg-void) 0%, var(--bg-deep) 50%, #09101e 100%);
      z-index: 0;
    }
    .bg-glow {
      position: fixed; top: 35%; left: 50%;
      transform: translate(-50%,-50%);
      width: 900px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.10) 0%, rgba(212,175,55,0.03) 40%, transparent 68%);
      animation: breathe 14s ease-in-out infinite;
      filter: blur(60px); z-index: 0;
    }
    .paper-texture {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }

    /* ══ DATE BADGE ══ */
    .eth-date {
      position: absolute; top: 62px; right: 68px; z-index: 10;
      font-size: 13px; letter-spacing: 0.16em;
      color: var(--gold-lt); font-weight: 700;
      background: rgba(255,255,255,0.03); border: 1px solid var(--white-06);
      padding: 6px 18px; border-radius: 16px;
    }

    /* ══ MAIN CONTENT ══ */
    .content {
      position: relative; z-index: 10;
      padding: 110px 88px 100px;
      display: flex; flex-direction: column; gap: 0;
    }

    /* Header */
    .header { margin-bottom: 52px; }
    .week-tag {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.38em; font-weight: 700;
      color: var(--gold-lt); text-transform: uppercase;
      border: 1px solid rgba(212,175,55,0.28); padding: 8px 28px; border-radius: 24px;
      background: rgba(212,175,55,0.05); margin-bottom: 28px;
      font-family: 'Cinzel', serif;
    }
    .title {
      font-size: 56px; font-weight: 900; line-height: 1.25;
      background: linear-gradient(to right, var(--white) 15%, var(--gold-lt) 50%, var(--white) 85%);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 28px;
    }
    .title-ornament {
      display: flex; align-items: center; gap: 14px;
    }
    .title-ornament-line {
      flex: 1; max-width: 160px; height: 1px;
      background: linear-gradient(90deg, rgba(212,175,55,0.60), transparent);
    }
    .title-ornament-line:last-child {
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.60));
    }
    .title-ornament-icon {
      font-size: 13px; color: var(--gold);
      filter: drop-shadow(0 0 8px var(--gold-glow));
      animation: shimmer 6s ease-in-out infinite;
    }

    /* Scripture highlight */
    .scripture-highlight {
      background: linear-gradient(145deg, rgba(212,175,55,0.08), rgba(212,175,55,0.03));
      border-left: 3px solid var(--gold);
      border-radius: 0 8px 8px 0;
      padding: 28px 36px;
      margin-bottom: 44px;
      box-shadow: inset 0 0 30px rgba(212,175,55,0.03);
    }
    .scripture-highlight #scripture-text {
      display: block;
      font-size: 28px; font-weight: 700; line-height: 1.60;
      color: var(--gold-lt); margin-bottom: 14px;
    }
    .scripture-ref {
      font-size: 18px; font-weight: 700;
      color: rgba(212,175,55,0.65); letter-spacing: 0.12em;
    }

    /* Reflection body */
    .reflection-body {
      margin-bottom: 44px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .reflection-body p {
      font-size: 26px; font-weight: 400; line-height: 1.80;
      color: var(--white-90);
    }

    /* Prayer section */
    .prayer-section {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(212,175,55,0.14);
      border-radius: 8px;
      padding: 32px 40px;
      margin-bottom: 44px;
    }
    .prayer-label {
      font-size: 12px; letter-spacing: 0.42em; font-weight: 700;
      color: var(--gold); text-transform: uppercase;
      font-family: 'Cinzel', serif; margin-bottom: 20px;
    }
    .prayer-text {
      font-size: 24px; font-weight: 500; line-height: 1.75;
      color: var(--white-70); font-style: italic;
    }

    /* Footer */
    .footer {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; padding: 0 20px 20px;
    }
    .footer-line {
      flex: 1; max-width: 200px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.38), transparent);
    }
    .logo-cross { font-size: 22px; color: var(--gold); opacity: 0.70; }
    .brand {
      font-size: 12px; letter-spacing: 0.44em; font-weight: 700;
      color: rgba(212,175,55,0.58); text-transform: uppercase;
      font-family: 'Cinzel', serif;
    }

    .ornament-bottom {
      display: none; /* hidden, kept for compat */
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-glow"></div>
  <div class="paper-texture"></div>

  <div class="eth-date" id="eth-date-badge"></div>

  <div class="content">
    <div class="header">
      <div class="week-tag">የሳምንቱ መንፈሳዊ ትምህርት</div>
      <h1 class="title" id="title">ርዕስ</h1>
      <div class="title-ornament">
        <div class="title-ornament-line"></div>
        <div class="title-ornament-icon">◆</div>
        <div class="title-ornament-line"></div>
      </div>
    </div>

    <div class="scripture-highlight">
      <span id="scripture-text">የመጽሐፍ ቅዱስ ቃል...</span>
      <span class="scripture-ref" id="scripture-ref">ማጣቀሻ</span>
    </div>

    <div class="reflection-body" id="reflection-body">
      <p>ማብራሪያ...</p>
    </div>

    <div class="prayer-section">
      <div class="prayer-label">ጸሎት</div>
      <div class="prayer-text" id="prayer-text">አቤቱ አምላካችን...</div>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <span class="logo-cross">✝</span>
      <span class="brand">EOTC Media Studio</span>
      <div class="footer-line"></div>
    </div>
  </div>

  <div class="ornament-bottom">✦</div>
</body>
</html>
