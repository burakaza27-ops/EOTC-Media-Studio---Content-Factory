<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Weekly Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void:  #010208;
      --bg-deep:  #060916;
      --gold:     #d4af37;
      --gold-lt:  #f0d890;
      --gold-glow:rgba(212,175,55,0.20);
      --mood-primary:       #d4af37;
      --mood-primary-light: #f0d890;
      --mood-glow:          rgba(212,175,55,0.20);
      --feast-gold:  #d4af37;
      --fast-purple: #9b72cf;
      --normal-blue: #6b9bd2;
      --white:    #ffffff;
      --white-90: rgba(255,255,255,0.90);
      --white-70: rgba(255,255,255,0.70);
      --white-50: rgba(255,255,255,0.50);
      --white-08: rgba(255,255,255,0.08);
      --white-06: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      width: 1080px; min-height: 1920px; height: auto;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      background: var(--bg-void); position: relative; overflow-x: hidden;
    }

    /* ══ BACKGROUNDS ══ */
    .bg-gradient {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(165deg, var(--bg-void) 0%, var(--bg-deep) 50%, #09101e 100%);
      z-index: 0;
    }
    .paper-texture {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }

    /* ══ CONTENT ══ */
    .content {
      position: relative; z-index: 10;
      width: 100%; min-height: 1920px;
      display: flex; flex-direction: column;
      padding: 110px 88px 100px;
    }

    /* Header */
    .header { text-align: center; margin-bottom: 52px; }
    .week-tag {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.38em; font-weight: 700;
      color: var(--gold-lt); text-transform: uppercase;
      border: 1px solid rgba(212,175,55,0.28); padding: 8px 28px; border-radius: 24px;
      background: rgba(212,175,55,0.05); margin-bottom: 22px;
      font-family: 'Cinzel', serif;
    }
    .week-title {
      font-size: 44px; font-weight: 900;
      background: linear-gradient(to right, var(--white) 10%, var(--gold-lt) 50%, var(--white) 90%);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,0.4));
      line-height: 1.30;
    }

    /* Calendar grid — dynamically injected HTML */
    .calendar-grid {
      flex: 1; display: flex; flex-direction: column; gap: 14px;
    }

    /* Styles for injected day cards — these match what src/pipeline/calendar.js generates */
    .calendar-grid .day-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 22px 28px;
      display: flex; align-items: flex-start; gap: 20px;
    }
    .calendar-grid .day-card.feast {
      background: rgba(212,175,55,0.07);
      border-color: rgba(212,175,55,0.22);
    }
    .calendar-grid .day-card.fast {
      background: rgba(100,50,180,0.08);
      border-color: rgba(155,114,207,0.22);
    }
    .calendar-grid .day-name {
      font-size: 20px; font-weight: 800; color: var(--white-90);
      min-width: 130px; letter-spacing: 0.02em;
    }
    .calendar-grid .day-events {
      flex: 1; font-size: 22px; font-weight: 500; line-height: 1.55;
      color: var(--white-70);
    }
    .calendar-grid .day-badge {
      font-size: 11px; letter-spacing: 0.30em; font-weight: 700;
      padding: 4px 14px; border-radius: 16px; text-transform: uppercase;
      font-family: 'Cinzel', serif; white-space: nowrap; align-self: center;
    }
    .calendar-grid .day-badge.feast { background: rgba(212,175,55,0.14); color: var(--gold-lt); }
    .calendar-grid .day-badge.fast  { background: rgba(155,114,207,0.14); color: var(--fast-purple); }
    .calendar-grid .day-badge.normal { background: rgba(107,155,210,0.10); color: var(--normal-blue); }

    /* Legend */
    .legend {
      display: flex; gap: 28px; justify-content: center;
      margin-top: 36px; margin-bottom: 36px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 16px; font-weight: 600; color: var(--white-70);
      font-family: 'Cinzel', serif; letter-spacing: 0.08em;
    }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%;
    }
    .legend-dot.mood-feast  { background: var(--feast-gold); box-shadow: 0 0 8px rgba(212,175,55,0.6); }
    .legend-dot.mood-fast   { background: var(--fast-purple); box-shadow: 0 0 8px rgba(155,114,207,0.6); }
    .legend-dot.mood-normal { background: var(--normal-blue); }

    /* Footer */
    .footer {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; margin-top: auto; padding-top: 20px;
    }
    .footer-line {
      flex: 1; max-width: 200px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.38), transparent);
    }
    .footer-text {
      font-size: 12px; letter-spacing: 0.44em; font-weight: 700;
      color: rgba(212,175,55,0.55); text-transform: uppercase;
      font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="paper-texture"></div>

  <div class="content">
    <div class="header">
      <div class="week-tag">የሳምንቱ መርሃ ግብር</div>
      <h1 class="week-title" id="week-title">Weekly Calendar</h1>
    </div>

    <div class="calendar-grid" id="calendar-grid">
      <!-- Dynamically injected -->
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot mood-feast"></div>Feast</div>
      <div class="legend-item"><div class="legend-dot mood-fast"></div>Fast</div>
      <div class="legend-item"><div class="legend-dot mood-normal"></div>Regular</div>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">EOTC Media Studio</div>
      <div class="footer-line"></div>
    </div>
  </div>
</body>
</html>
