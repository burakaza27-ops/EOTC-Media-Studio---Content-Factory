<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOTC Weekly Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-ivory: #faf8f4;
      --bg-cream: #f5f2ec;
      --gold: #b8860b;
      --gold-light: #d4a418;
      --gold-dim: rgba(184, 134, 11, 0.55);
      --gold-glow: rgba(184, 134, 11, 0.10);
      --ink: #0f1419;
      --ink-body: #2d3340;
      --ink-muted: #6b7280;
      --mood-primary: #b8860b;
      --mood-primary-light: #d4a418;
      --mood-primary-dim: rgba(184, 134, 11, 0.55);
      --feast-gold: #d4af37;
      --fast-purple: #7c3aed;
      --normal-blue: #3b82f6;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1, "liga" 1; }

    body {
      width: 1080px; min-height: 1920px; height: auto;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      background: var(--bg-ivory); position: relative;
    }

    .bg-gradient {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, var(--bg-ivory) 0%, var(--bg-cream) 50%, #eee9e0 100%);
      z-index: 0;
    }

    .paper-texture {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      z-index: 1; pointer-events: none;
    }

    

    .content {
      position: relative; z-index: 10;
      width: 100%; min-height: 1920px;
      display: flex; flex-direction: column;
      padding: 110px 90px;
    }

    .header { text-align: center; margin-bottom: 40px; }

    .week-tag {
      font-size: 15px; font-weight: 700; letter-spacing: 0.25em;
      color: var(--gold); text-transform: uppercase;
      border-bottom: 1.5px solid var(--gold); padding-bottom: 10px;
      display: inline-block; margin-bottom: 20px;
    }

    .week-title {
      font-size: 40px; font-weight: 900; color: var(--ink);
      line-height: 1.3;
    }

    
    /* === LALIBELA CROSS BRAND === */
    .brand-lalibela { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .brand-lalibela img { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="paper-texture"></div>
  

  <div class="content">
    <div class="header">
      <div class="week-tag">📅 የሳምንቱ መርሃ ግብር</div>
      <h1 class="week-title" id="week-title">Weekly Calendar</h1>
    </div>

    <div class="calendar-grid" id="calendar-grid">
      <!-- Dynamically injected -->
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot mood-feast"></div>Feast</div>
      <div class="legend-item"><div class="legend-dot mood-fast"></div>Fast</div>
      <div class="legend-item"><div class="legend-dot mood-normal"></div>Regular</div>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">EOTC Media Studio</div>
      <div class="footer-line"></div>
    </div>
  </div>
</body>
</html>
