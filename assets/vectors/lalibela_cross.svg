<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="35%" stop-color="#e2ba4d"/>
      <stop offset="70%" stop-color="#c1932e"/>
      <stop offset="100%" stop-color="#8c6416"/>
    </linearGradient>
    <filter id="sacredGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <g fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#sacredGlow)">
    <!-- Central Cross Stem & Arms -->
    <line x1="200" y1="40" x2="200" y2="360" stroke-width="10"/>
    <line x1="70" y1="170" x2="330" y2="170" stroke-width="10"/>

    <!-- Central Diamond & Trefoil -->
    <polygon points="200,130 240,170 200,210 160,170" fill="url(#goldGrad)" fill-opacity="0.15" stroke-width="5"/>
    <circle cx="200" cy="170" r="14" fill="url(#goldGrad)"/>

    <!-- Top Finial Pattern (Lalibela Openwork) -->
    <path d="M 180,90 C 160,70 160,40 200,30 C 240,40 240,70 220,90 Z" fill="none" stroke-width="6"/>
    <circle cx="200" cy="65" r="8" fill="url(#goldGrad)"/>

    <!-- Left Arm Finial -->
    <path d="M 120,150 C 100,130 70,130 60,170 C 70,210 100,210 120,190 Z" fill="none" stroke-width="6"/>
    <circle cx="90" cy="170" r="8" fill="url(#goldGrad)"/>

    <!-- Right Arm Finial -->
    <path d="M 280,150 C 300,130 330,130 340,170 C 330,210 300,210 280,190 Z" fill="none" stroke-width="6"/>
    <circle cx="310" cy="170" r="8" fill="url(#goldGrad)"/>

    <!-- Bottom Handle & Stepped Base -->
    <path d="M 185,250 L 170,300 L 230,300 L 215,250 Z" stroke-width="5"/>
    <line x1="150" y1="330" x2="250" y2="330" stroke-width="8"/>
    <line x1="130" y1="355" x2="270" y2="355" stroke-width="9"/>

    <!-- Sacred Knotwork / Interlaced Wings -->
    <path d="M 160,130 Q 130,100 160,70 Q 200,100 160,130" stroke-width="4"/>
    <path d="M 240,130 Q 270,100 240,70 Q 200,100 240,130" stroke-width="4"/>
    <path d="M 160,210 Q 130,240 160,270 Q 200,240 160,210" stroke-width="4"/>
    <path d="M 240,210 Q 270,240 240,270 Q 200,240 240,210" stroke-width="4"/>
  </g>
</svg>
